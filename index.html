<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Cup 2026 UK TV Guide</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Barlow Condensed', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #003399;
            color: #fff;
            padding: 8px 12px 6px;
            border-bottom: 3px solid #FFD700;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 12px rgba(0, 31, 102, 0.35);
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: -0.03em;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #fff;
        }

        h1 img {
            height: 34px;
            width: auto;
            display: block;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 18px;
                gap: 10px;
            }

            h1 img {
                height: 28px;
            }
        }

        .filterToggleBtn {
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 0 10px;
            height: 32px;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
            background: #eff6ff;
            color: #0b2a6d;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .clearFiltersBtn {
            border-color: #fecaca;
            background: #fff1f2;
            color: #9f1239;
            width: 32px;
            min-width: 32px;
            padding: 0;
            font-size: 16px;
            line-height: 1;
        }

        .clearFiltersBtn:hover {
            background: #ffe4e6;
            border-color: #fda4af;
        }

        .timezoneMenuWrap {
            position: relative;
        }

        .timezoneMenuBtn {
            min-width: auto;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timezoneMenuPanel {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            width: 200px;
            max-height: 280px;
            overflow-y: auto;
            padding: 6px;
            background: #fff;
            border: 1px solid #dbe3ef;
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(2, 6, 23, 0.22);
            z-index: 30;
            display: none;
        }

        .timezoneMenuPanel.open {
            display: block;
        }

        .timezoneMenuOption {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
            color: #0f172a;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            text-align: left;
            padding: 7px 9px;
            margin: 0 0 5px;
            cursor: pointer;
        }

        .timezoneMenuOption:last-child {
            margin-bottom: 0;
        }

        .timezoneMenuOption:hover {
            border-color: #93c5fd;
            background: #eef4ff;
        }

        .timezoneMenuOption.active {
            border-color: #003399;
            background: #e8f0ff;
            color: #0b2a6d;
        }

        .groupMenuWrap {
            position: relative;
        }

        .teamMenuWrap {
            position: relative;
        }

        .groupMenuBtn {
            min-width: 80px;
        }

        .groupMenuPanel {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            width: 176px;
            max-height: 280px;
            overflow-y: auto;
            padding: 6px;
            background: #fff;
            border: 1px solid #dbe3ef;
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(2, 6, 23, 0.22);
            z-index: 30;
            display: none;
        }

        .groupMenuPanel.open {
            display: block;
        }

        .teamMenuPanel {
            width: 220px;
        }

        .groupMenuOption {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
            color: #0f172a;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            text-align: left;
            padding: 7px 9px;
            margin: 0 0 5px;
            cursor: pointer;
        }

        .groupMenuOption:last-child {
            margin-bottom: 0;
        }

        .groupMenuOption:hover {
            border-color: #93c5fd;
            background: #eef4ff;
        }

        .groupMenuOption.active {
            border-color: #003399;
            background: #e8f0ff;
            color: #0b2a6d;
        }

        .groupMenuRow {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .groupMenuFlags {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .groupMenuFlags img {
            width: 16px;
            height: 12px;
            border-radius: 2px;
            object-fit: cover;
        }

        .groupsMenu {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.65);
            z-index: 39;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .groupsMenu.open {
            display: flex;
        }

        .groupsMenuPanel {
            width: min(980px, 100%);
            height: min(88vh, 860px);
            background: #fff;
            border-radius: 16px;
            border: 1px solid #dbe3ef;
            box-shadow: 0 18px 46px rgba(2, 6, 23, 0.28);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .groupsMenuHeader {
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .groupsMenuHeader h2 {
            margin: 0;
            font-size: 20px;
            color: #0b2a6d;
        }

        .groupsMenuHeader button {
            background: #f1f5f9;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            font-size: 20px;
            cursor: pointer;
            color: #475569;
        }

        .groupsMenuContent {
            overflow-y: auto;
            flex: 1;
            padding: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .groupsOverviewGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 10px;
        }

        .groupOverviewCard {
            border: 1px solid #dbe3ef;
            border-radius: 12px;
            background: #fff;
            padding: 12px;
            cursor: pointer;
            text-align: left;
        }

        .groupOverviewCard:hover {
            border-color: #003399;
            box-shadow: 0 8px 18px rgba(0, 51, 153, 0.14);
            transform: translateY(-2px);
        }

        .groupOverviewTitle {
            font-size: 15px;
            font-weight: 800;
            color: #0b2a6d;
            margin-bottom: 8px;
        }

        .groupOverviewStandings {
            max-height: 320px;
            overflow: auto;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #fafcff;
            padding: 8px;
        }

        .groupOverviewStandings .standings {
            margin: 0;
        }

        .groupOverviewStandings .standings h3 {
            font-size: 13px;
            margin-bottom: 8px;
        }

        .groupOverviewStandings .standings-table {
            font-size: 11px;
        }

        .groupOverviewStandings .standings th,
        .groupOverviewStandings .standings td {
            padding: 3px 4px;
        }

        .groupOverviewTeams {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .groupOverviewTeam {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            color: #0f172a;
            font-size: 12px;
            font-weight: 700;
        }

        .filterToggleBtn:hover {
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .filterPanel {
            display: block;
            margin-top: 6px;
        }

        .topNav {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            margin-bottom: 6px;
            align-items: center;
            justify-content: center;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
            flex-wrap: nowrap;
        }

        .timeControls {
            display: flex;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }

        .dateNav {
            display: flex;
            gap: 6px;
            flex: 0 0 auto;
        }

        .dateNav button,
        .today,
        .teamChip {
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 0 10px;
            font: inherit;
            font-weight: 700;
            font-size: 13px;
            background: #eff6ff;
            color: #0b2a6d;
            cursor: pointer;
            transition: all 0.2s;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .dateNav button:hover,
        .today:hover,
        .teamChip:hover {
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .dateNav button {
            flex: none;
            width: 38px;
            min-width: 38px;
            padding: 0;
            font-size: 15px;
        }

        .today {
            flex: 1;
            max-width: 92px;
            background: #FFD700;
            border-color: #FFD700;
            color: #003399;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
        }

        .today:hover {
            background: #FFC700;
        }

        .bottomDateLabel {
            margin: 2px 0 6px;
            color: #dbeafe;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-align: center;
        }

        .dateLine {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            min-height: 0;
        }

        .calendarCard {
            display: none;
            background: #fff;
            border: 1px solid #dbe3ef;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.15);
            max-width: 720px;
            margin: 0 auto 12px;
        }

        .calendarCard.open {
            display: block;
        }

        .calendarTop {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .calendarMonthLabel {
            font-size: 16px;
            font-weight: 700;
            color: #003399;
        }

        .calendarNavBtn {
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            background: #f8fafc;
            color: #0f172a;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        .calendarWeekdays,
        .calendarGrid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 6px;
        }

        .calendarWeekday {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
        }

        .calendarDayCell {
            min-height: 62px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
            padding: 4px;
            text-align: left;
            cursor: pointer;
        }

        .calendarDayCell:hover {
            border-color: #003399;
            box-shadow: 0 3px 10px rgba(0, 51, 153, 0.12);
        }

        .calendarDayCell.empty {
            background: #f8fafc;
            border-style: dashed;
            cursor: default;
        }

        .calendarDayCell.active {
            border-color: #003399;
            background: #eef4ff;
        }

        .calendarDayNum {
            font-size: 12px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 3px;
        }

        .calendarFlags {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }

        .calendarFlag {
            width: 14px;
            height: 10px;
            border-radius: 2px;
            object-fit: cover;
        }

        .calendarMore {
            font-size: 10px;
            color: #64748b;
            font-weight: 600;
        }

        .calendarUnknown {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            font-weight: 700;
            color: #003399;
            background: #eef4ff;
            border: 1px solid #cfe0ff;
            border-radius: 999px;
            padding: 1px 5px;
            margin-top: 2px;
        }

        input[type="date"] {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px 10px;
            background: #f8fafc;
            color: #0f172a;
            font: inherit;
            font-size: 13px;
        }

        input[type="date"]::placeholder {
            color: #94a3b8;
        }

        .chips {
            display: flex;
            flex-direction: row;
            gap: 8px;
            padding: 0;
            flex-wrap: wrap;
            margin: 0;
            justify-content: center;
        }

        .teamChip {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .teamChip.active {
            background: #FFD700;
            border-color: #FFD700;
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.35);
            color: #003399;
        }

        .teamClearBtn {
            border-color: #fecaca;
            background: #fff1f2;
            color: #9f1239;
        }

        .teamClearBtn:hover {
            border-color: #fda4af;
            background: #ffe4e6;
        }

        .flag {
            font-size: 22px;
            line-height: 1;
        }

        .flag-img {
            width: 22px;
            height: 16px;
            vertical-align: middle;
            margin-right: 2px;
        }

        main {
            padding: 12px;
            max-width: 780px;
            margin: 0 auto;
        }

        .summary {
            color: #64748b;
            font-size: 14px;
            margin: 0 0 10px;
        }

        .match {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px;
            margin: 12px 0;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
            transition: all 0.2s;
            cursor: pointer;
        }

        .match:hover {
            box-shadow: 0 8px 20px rgba(0, 51, 153, 0.12);
            transform: translateY(-2px);
            border-color: #003399;
        }

        .match.finished {
            border: 2px solid #16a34a;
            box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.12);
        }

        .matchTop {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
        }

        .fixture {
            font-size: 17px;
            font-weight: 900;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time {
            font-size: 20px;
            font-weight: 900;
            white-space: nowrap;
            color: #003399;
        }

        .meta {
            color: #64748b;
            font-size: 12px;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .scorePill {
            display: inline-block;
            margin: 0 6px;
            padding: 3px 10px;
            border-radius: 6px;
            background: #FFD700;
            color: #003399;
            font-size: 12px;
            font-weight: 800;
            vertical-align: middle;
        }

        .tv {
            margin-top: 12px;
            padding: 12px;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2f7 100%);
            border: 1px solid #cbd5e1;
            border-radius: 10px;
        }

        .tv.bc-bbc {
            background: linear-gradient(135deg, #ffd5ec 0%, #ff9fcb 100%);
            border-color: #f6a9cf;
        }

        .tv.bc-itv {
            background: linear-gradient(135deg, #d7f8ee 0%, #9ee7cf 100%);
            border-color: #9ddac7;
        }

        .tv.bc-tbc {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2f7 100%);
            border-color: #cbd5e1;
        }

        .tv strong {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .tv strong img {
            height: 18px;
            width: auto;
        }

        /* Match outcome indicators */
        .flag-winner,
        .flag-winner img,
        .flag-winner svg {
            filter: drop-shadow(0 0 1.5px #22c55e) drop-shadow(0 0 0.5px #16a34a);
        }

        .flag-loser,
        .flag-loser img,
        .flag-loser svg {
            filter: drop-shadow(0 0 1.5px #ef4444) drop-shadow(0 0 0.5px #dc2626);
        }

        .flag-draw,
        .flag-draw img,
        .flag-draw svg {
            filter: drop-shadow(0 0 1.5px #9ca3af) drop-shadow(0 0 0.5px #6b7280);
        }

        .stream {
            color: #64748b;
            font-size: 13px;
            margin-top: 3px;
        }

        .empty {
            text-align: center;
            color: #64748b;
            background: #fff;
            border: 1px dashed #cbd5e1;
            border-radius: 18px;
            padding: 28px 16px;
        }

        .calendarBtn {
            width: 32px;
            height: 32px;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            background: #eff6ff;
            color: #0b2a6d;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .calendarBtn:hover {
            background: #f1f5f9;
        }

        #datePicker {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .widgetDock {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 35;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .contentActions {
            display: flex;
            flex-direction: row;
            gap: 8px;
        }

        .contentActionBtn {
            border: 1px solid transparent;
            border-radius: 999px;
            padding: 0 14px;
            height: 40px;
            color: #ffffff;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(2, 6, 23, 0.28);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
        }

        #allMatchesBtn {
            background: linear-gradient(135deg, #003399 0%, #1f66ff 100%);
            border-color: #2955cc;
        }

        #mosaicBtn {
            background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
            border-color: #c56f08;
            color: #1f2937;
        }

        .contentActionBtn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(2, 6, 23, 0.34);
            filter: brightness(1.04);
        }

        .floatingMenu {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.65);
            z-index: 40;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .floatingMenu.open {
            display: flex;
        }

        .floatingMenuPanel {
            width: min(1200px, 100%);
            height: min(88vh, 880px);
            background: #fff;
            border-radius: 16px;
            border: 1px solid #dbe3ef;
            box-shadow: 0 18px 46px rgba(2, 6, 23, 0.28);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .floatingMenuHeader {
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .floatingMenuHeader h2 {
            margin: 0;
            font-size: 20px;
            color: #0b2a6d;
        }

        .floatingMenuHeader button {
            background: #f1f5f9;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            font-size: 20px;
            cursor: pointer;
            color: #475569;
        }

        .floatingMenuContent {
            overflow-y: auto;
            flex: 1;
            padding: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .mosaicGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .mosaicLegend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            color: #334155;
        }

        .mosaicLegendChip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0;
            font-weight: 600;
            border: none;
            background: none;
            color: #334155;
        }

        .mosaicLegendChip.bc-bbc {
            color: #a21caf;
        }

        .mosaicLegendChip.bc-itv {
            color: #047857;
        }

        .mosaicLegendChip.bc-tbc {
            color: #475569;
        }

        .mosaicLegendChip::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid rgba(15, 23, 42, 0.15);
        }

        .mosaicLegendChip.bc-bbc::before {
            background: linear-gradient(135deg, #ffd5ec 0%, #ff9fcb 100%);
            border-color: #f6a9cf;
        }

        .mosaicLegendChip.bc-itv::before {
            background: linear-gradient(135deg, #d7f8ee 0%, #9ee7cf 100%);
            border-color: #9ddac7;
        }

        .mosaicLegendChip.bc-tbc::before {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2f7 100%);
            border-color: #cbd5e1;
        }

        .mosaicLegendChip:last-child::before {
            display: none;
        }

        // Timezone mapping: venue city -> IANA timezone, offset for June 2026 (BST/EDT/CDT/PDT)

        const FILTERS_COOKIE_NAME = 'wcup_filters_v1';

        function setCookie(name, value, days) {
            const expires = new Date(Date.now() + days * 864e5).toUTCString();
            document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
        }

        function getCookie(name) {
            const prefix = `${name}=`;
            const parts = document.cookie.split(';');
            for (const part of parts) {
                const trimmed = part.trim();
                if (trimmed.startsWith(prefix)) {
                    return decodeURIComponent(trimmed.slice(prefix.length));
                }
            }
            return '';
        }

        function saveFiltersToCookie() {
            const payload = {
                selectedDate,
                selectedTeams,
                // Avoid sticky group filter after reload.
                selectedGroup: '',
                selectedTimezone
            };
            setCookie(FILTERS_COOKIE_NAME, JSON.stringify(payload), 30);
        }

        function loadFiltersFromCookie() {
            const raw = getCookie(FILTERS_COOKIE_NAME);
            if (!raw) return;
            try {
                const saved = JSON.parse(raw);
                if (saved && typeof saved.selectedDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(saved.selectedDate)) {
                    selectedDate = saved.selectedDate;
                }
                if (saved && Array.isArray(saved.selectedTeams)) {
                    selectedTeams = saved.selectedTeams.filter(team => typeof team === 'string' && team);
                } else if (saved && typeof saved.selectedTeam === 'string' && saved.selectedTeam) {
                    selectedTeams = [saved.selectedTeam];
                }
                // Group filter is intentionally not restored from cookie.
                if (saved && typeof saved.selectedTimezone === 'string' && TIMEZONE_OFFSETS[saved.selectedTimezone]) {
                    selectedTimezone = saved.selectedTimezone;
                }
            } catch {
                // Ignore invalid cookie payload.
            }
        }

        loadFiltersFromCookie();

        function convertTimeToTimezone(dateStr, timeUKStr, venueCity, targetTimezone) {
            if (!dateStr || !timeUKStr) return { time: timeUKStr, date: dateStr, day: '' };

            // Parse the time components
            const [hoursUK, minutesUK] = timeUKStr.split(':').map(x => parseInt(x, 10));

            // In June 2026, UK is in BST (UTC+1)
            const ukOffset = 1;
            const targetOffset = TIMEZONE_OFFSETS[targetTimezone]?.offset || 0;

            // Calculate hours difference
            const hourDiff = targetOffset - ukOffset;

            // Calculate new time
            let newHours = hoursUK + hourDiff;
            let newDate = dateStr;
            let dayAdjustment = 0;

            // Handle day changes
            if (newHours < 0) {
                newHours += 24;
                dayAdjustment = -1;
            } else if (newHours >= 24) {
                newHours -= 24;
                dayAdjustment = 1;
            }

            // Adjust date if needed
            if (dayAdjustment !== 0) {
                const dateObj = new Date(dateStr + 'T00:00:00Z');
                dateObj.setUTCDate(dateObj.getUTCDate() + dayAdjustment);
                newDate = dateObj.toISOString().split('T')[0];
            }

            const timeLocal = String(newHours).padStart(2, '0') + ':' + String(minutesUK).padStart(2, '0');

            // Get day name for the new date
            const dayObj = new Date(newDate + 'T12:00:00Z');
            const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayLocal = dayNames[dayObj.getUTCDay()];

            return { time: timeLocal, date: newDate, day: dayLocal };
        }

                target = [...matchDates].reverse().find(date => date < selectedDate) || matchDates[matchDates.length - 1];

            const today = isoToday();

        function getDayCalendarData(isoDate) {
            const dayMatches = fixtures.filter(match => match.date === isoDate);
            const knownTeams = new Set();
            let unknownMatches = 0;

            dayMatches.forEach(match => {
                const teams = match.teams || [];
                const hasUnknown = teams.some(team => !FLAGS[team]);
                if (hasUnknown) {
                    unknownMatches++;
                }
                teams.forEach(team => {
                    if (FLAGS[team]) {
                        knownTeams.add(team);
                    }
                });
            });

            return {
                knownTeams: Array.from(knownTeams),
                unknownMatches
            };

        function getGroupTeams(group) {

        function getAvailableTeams() {
            const teams = new Set();
            fixtures.forEach(match => {
                (match.teams || []).forEach(team => teams.add(team));
            });

            return Array.from(teams)
                .filter(team => !!FLAGS[team])
                .sort((a, b) => {
                    const aIndex = FOLLOWED_TEAMS.indexOf(a);
                    const bIndex = FOLLOWED_TEAMS.indexOf(b);

                    if (aIndex !== -1 || bIndex !== -1) {
                        if (aIndex === -1) return 1;
                        if (bIndex === -1) return -1;
                        return aIndex - bIndex;
                    }

                    return a.localeCompare(b, undefined, { numeric: true });
                });

        function getVisibleMatches() {

                if (selectedGroup) {

                    // When one or more teams are selected, show matches for any selected team
                    return (match.teams || []).some(team => selectedTeams.includes(team));
                } else {

        function getMatchOutcome(match, teamIndex) {
            // Returns: 'winner', 'loser', 'draw', or null
            const score = getNumericScore(match);
            if (!score) return null;

            if (score.home === score.away) {
                return 'draw';
            }

            const isHome = teamIndex === 0;
            const isWinner = (isHome && score.home > score.away) || (!isHome && score.away > score.home);
            return isWinner ? 'winner' : 'loser';
        }

        function buildGroupStandingsHTML(group, options = {}) {
            const compact = !!options.compact;
            const teamIds = getGroupTeams(group);
            const groupMatches = fixtures.filter(m => m.group === group);

            // Initialize standings data
            const standings = {};
            teamIds.forEach(team => {
                standings[team] = { P: 0, W: 0, D: 0, L: 0, GF: 0, GA: 0, GD: 0, Pts: 0 };
            });

            // Calculate standings from matches
            groupMatches.forEach(match => {
                const teams = match.teams;
                if (teams && teams.length === 2) {
                    const [team1, team2] = teams;
                    const score = getNumericScore(match);
                    if (!score) {
                        return;
                    }

                    standings[team1].P++;
                    standings[team2].P++;
                    standings[team1].GF += score.home;
                    standings[team1].GA += score.away;
                    standings[team2].GF += score.away;
                    standings[team2].GA += score.home;

                    if (score.home > score.away) {
                        standings[team1].W++;
                        standings[team1].Pts += 3;
                        standings[team2].L++;
                    } else if (score.home < score.away) {
                        standings[team2].W++;
                        standings[team2].Pts += 3;
                        standings[team1].L++;
                    } else {
                        standings[team1].D++;
                        standings[team2].D++;
                        standings[team1].Pts += 1;
                        standings[team2].Pts += 1;
                    }

                    standings[team1].GD = standings[team1].GF - standings[team1].GA;
                    standings[team2].GD = standings[team2].GF - standings[team2].GA;
                }
            });

            // Sort by points (desc), then by goal difference (desc), then by goals for (desc)
            const sorted = Object.entries(standings).sort((a, b) => {
                if (b[1].Pts !== a[1].Pts) return b[1].Pts - a[1].Pts;
                if (b[1].GD !== a[1].GD) return b[1].GD - a[1].GD;
                return b[1].GF - a[1].GF;
            });

            const tableHTML = `
                <div class="standings">
                    <h3>Group ${group} Standings</h3>
                    <table class="standings-table">
                        <thead>
                            <tr>
                                ${compact ? '' : '<th style="width: 30px;">Pos</th>'}
                                <th>Team</th>
                                <th class="standings-stat">P</th>
                                <th class="standings-stat">W</th>
                                <th class="standings-stat">D</th>
                                <th class="standings-stat">L</th>
                                <th class="standings-pts">Pts</th>
                                ${compact ? '' : '<th class="standings-stat">GF</th><th class="standings-stat">GA</th><th class="standings-stat">GD</th>'}
                            </tr>
                        </thead>
                        <tbody>
                            ${sorted.map((entry, idx) => {
                const team = entry[0];
                const stats = entry[1];
                return `
                                    <tr>
                                        ${compact ? '' : `<td class="standings-pos">${idx + 1}</td>`}
                                        <td>
                                            <div class="standings-team">
                                                ${FLAGS[team] || '🏳️'}
                                                <span>${getShortName(team)}</span>
                                            </div>
                                        </td>
                                        <td class="standings-stat">${stats.P}</td>
                                        <td class="standings-stat">${stats.W}</td>
                                        <td class="standings-stat">${stats.D}</td>
                                        <td class="standings-stat">${stats.L}</td>
                                        <td class="standings-pts">${stats.Pts}</td>
                                        ${compact ? '' : `<td class="standings-stat">${stats.GF}</td>
                                        <td class="standings-stat">${stats.GA}</td>
                                        <td class="standings-stat">${stats.GD > 0 ? '+' : ''}${stats.GD}</td>`}
                                    </tr>
                                `;
            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            return tableHTML;
        }

        function getNumericScore(match) {
            if (typeof match.homeScore === 'number' && typeof match.awayScore === 'number') {
                return { home: match.homeScore, away: match.awayScore };
            }

            if (match.score && typeof match.score.home === 'number' && typeof match.score.away === 'number') {
                return { home: match.score.home, away: match.score.away };
            }

            if (typeof match.result === 'string') {
                const m = match.result.match(/(\d+)\s*[-:]\s*(\d+)/);
                if (m) {
                    return { home: Number(m[1]), away: Number(m[2]) };
                }
            }

            return null;
        }

        function getMatchScoreText(match) {
            const score = getNumericScore(match);
            if (!score) {
                return 'vs';
            }
            return `${score.home}-${score.away}`;
        }

        function isMatchFinished(match) {
            return !!getNumericScore(match);
        }

        function getMatchDateTime(match) {
            if (!match || !match.date) return new Date(0);
            const time = typeof match.timeUK === 'string' && /^\d{1,2}:\d{2}$/.test(match.timeUK)
                ? match.timeUK
                : '12:00';
            return new Date(`${match.date}T${time}:00`);
        }

        function getNextUpcomingMatch() {
            const now = new Date();
            return fixtures
                .slice()
                .sort((a, b) => getMatchDateTime(a) - getMatchDateTime(b))
                .find(match => getMatchDateTime(match) >= now) || null;
        }

        function goToMatch(match) {
            if (!match) return;

            if (match.date) {
                selectedDate = match.date;
                datePicker.value = selectedDate;
            }

            selectedTeams = [];
            if (match.group) {
                selectedGroup = match.group;
                startGroupLiveRefresh();
            } else {
                selectedGroup = '';
                stopGroupLiveRefresh();
            }

            render();

            setTimeout(() => {
                const selector = `.match[data-matchno="${match.matchNo || ''}"]`;
                const target = document.querySelector(selector);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 80);
        }

        function renderNextMatchWidget() {
            const next = getNextUpcomingMatch();
            if (!next) {
                nextMatchWidget.classList.remove('show');
                return;
            }

            const left = next.teams?.[0] || 'TBD';
            const right = next.teams?.[1] || 'TBD';
            nextMatchTeams.innerHTML = `${renderTeamShort(left)} <span class="scorePill">v</span> ${renderTeamShort(right)}`;
            const tzConversion = convertTimeToTimezone(next.date, next.timeUK, next.venueCity, selectedTimezone);
            const displayTime = selectedTimezone === 'Europe/London' ? next.timeUK : tzConversion.time;
            const dateText = next.date ? `${next.date.slice(8, 10)}/${next.date.slice(5, 7)}` : '';
            const metaText = `${dateText}${displayTime ? ` ${displayTime}` : ''}`.trim();
            nextMatchTitle.textContent = metaText ? `Next Match ${metaText}` : 'Next Match';
            nextMatchMeta.textContent = '';
            nextMatchWidget.className = `nextMatchWidget ${getBroadcasterClass(next.broadcast)}`;
            nextMatchWidget.onclick = () => goToMatch(next);
            nextMatchWidget.classList.add('show');
        }

        function stopGroupLiveRefresh() {
            if (liveRefreshTimer) {
                clearInterval(liveRefreshTimer);
                liveRefreshTimer = null;
            }
        }

        // Note: Team name normalization handled by proxy server
        // Keeping this stub for backward compatibility
        function normalizeSportsDBTeamName(name) {
            return name;
        }

        function fetchLiveScores(options = {}) {
            const now = Date.now();
            const proxyUrl = 'http://localhost:3000/api/scores';

            // Avoid hammering proxy: reuse a recent result for 2 minutes.
            if (!options.force && (now - liveScoresCache.fetchedAt) < 120000) {
                return Promise.resolve(liveScoresCache.scoreMap || {});
            }

            // If we were rate-limited, skip network calls for a short cooldown window.
            if (sportsDbCooldownUntil > now) {
                return Promise.resolve(liveScoresCache.scoreMap || {});
            }

            // Deduplicate concurrent callers (initial load + overlays + refresh timers).
            if (liveScoresInFlight) {
                return liveScoresInFlight;
            }

            liveScoresInFlight = (async () => {
                try {
                    const response = await fetch(proxyUrl, { cache: 'no-store' });

                    if (!response.ok) {
                        if (response.status === 429) {
                            sportsDbCooldownUntil = Date.now() + 5 * 60 * 1000;
                            console.warn('Score proxy rate-limited. Using cached scores for 5 minutes.');
                            return liveScoresCache.scoreMap || {};
                        }
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const scoreMap = await response.json();
                    liveScoresCache = { fetchedAt: now, scoreMap };
                    console.log(`[PROXY] Fetched ${Object.keys(scoreMap).length} finished matches`);
                    return scoreMap;
                } catch (error) {
                    console.warn('Failed to fetch live scores from proxy:', error);
                    return liveScoresCache.scoreMap || {};
                } finally {
                    liveScoresInFlight = null;
                }
            })();

            return liveScoresInFlight;
        }

        function mergeScores(scoreMap) {
            fixtures.forEach(match => {
                const key = `${match.teams[0]}|${match.teams[1]}`;
                if (scoreMap[key]) {
                    match.homeScore = scoreMap[key].homeScore;
                    match.awayScore = scoreMap[key].awayScore;
                }
            });
        }

        function startGroupLiveRefresh() {
            stopGroupLiveRefresh();
            refreshFixturesNow();
            liveRefreshTimer = setInterval(() => {
                if (selectedGroup) {
                    refreshFixturesNow();
                }
            }, 60000);
        }

        function refreshFixturesNow() {
            fetchLiveScores({ recentOnly: true })
                .then(scoreMap => {
                    mergeScores(scoreMap);
                    render();
                })
                .catch(() => {
                    // Keep current data if refresh fails.
                });
        }

        function refreshFixturesSilent() {
            return fetchLiveScores({ recentOnly: false })
                .then(scoreMap => {
                    mergeScores(scoreMap);
                })
                .catch(() => {
                    // Keep current data if refresh fails.
                });
        }

        function ensureFloatingMenuElements() {
            let menu = document.getElementById('floatingMenu');
            if (!menu) {
                menu = document.createElement('div');
                menu.id = 'floatingMenu';
                menu.className = 'floatingMenu';
                menu.innerHTML = `
                    <div class="floatingMenuPanel">
                        <div class="floatingMenuHeader">
                            <h2>All Matches Mosaic</h2>
                            <button id="closeMenuBtn">✕</button>
                        </div>
                        <div class="floatingMenuContent" id="floatingMenuContent"></div>
                    </div>
                `;
                document.body.appendChild(menu);
            }
            return menu;
        }

        const floatingMenu = ensureFloatingMenuElements();
        const floatingMenuContent = document.getElementById('floatingMenuContent');
        const allMatchesBtn = document.getElementById('allMatchesBtn');
        const mosaicBtn = document.getElementById('mosaicBtn');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const listMenu = document.getElementById('listMenu');
        const listMenuContent = document.getElementById('listMenuContent');
        const closeListMenuBtn = document.getElementById('closeListMenuBtn');
        const groupsMenu = document.getElementById('groupsMenu');
        const groupsMenuContent = document.getElementById('groupsMenuContent');
        const closeGroupsMenuBtn = document.getElementById('closeGroupsMenuBtn');
        const nextMatchBtn = document.getElementById('nextMatchBtn');

        if (allMatchesBtn) {
            allMatchesBtn.onclick = (event) => {
                event.stopPropagation();
                listMenu.classList.add('open');
                renderAllMatchesList();
                refreshFixturesSilent().then(() => {
                    renderAllMatchesList();
                });
            };
        }

        if (mosaicBtn) {
            mosaicBtn.onclick = (event) => {
                event.stopPropagation();
                floatingMenu.classList.add('open');
                renderFloatingMenu();
                refreshFixturesSilent().then(() => {
                    renderFloatingMenu();
                });
            };
        }

        if (closeMenuBtn) {
            closeMenuBtn.onclick = () => {
                floatingMenu.classList.remove('open');
            };
        }

        floatingMenu.addEventListener('click', (event) => {
            if (event.target === floatingMenu) {
                floatingMenu.classList.remove('open');
            }
        });

        if (closeListMenuBtn) {
            closeListMenuBtn.onclick = () => {
                listMenu.classList.remove('open');
            };
        }

        listMenu.addEventListener('click', (event) => {
            if (event.target === listMenu) {
                listMenu.classList.remove('open');
            }
        });

        function openAllGroupsView() {
            if (!groupsMenu) return;
            renderAllGroupsView();
            groupsMenu.classList.add('open');
        }

        function closeAllGroupsView() {
            if (!groupsMenu) return;
            groupsMenu.classList.remove('open');
        }

        function renderAllGroupsView() {
            if (!groupsMenuContent) return;
            const groups = getAvailableGroups();
            if (!groups.length) {
                groupsMenuContent.innerHTML = '<div class="empty">No groups available</div>';
                return;
            }

            const cards = groups.map(group => {
                const standings = buildGroupStandingsHTML(group, { compact: true });
                return `
                    <button class="groupOverviewCard" data-group="${group}" type="button">
                        <div class="groupOverviewTitle">Group ${group}</div>
                        <div class="groupOverviewStandings">${standings}</div>
                    </button>
                `;
            }).join('');

            groupsMenuContent.innerHTML = `<div class="groupsOverviewGrid">${cards}</div>`;

            groupsMenuContent.querySelectorAll('.groupOverviewCard').forEach(card => {
                card.onclick = () => {
                    const group = card.dataset.group || '';
                    closeAllGroupsView();
                    selectGroupFilter(group);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
            });
        }

        if (closeGroupsMenuBtn) {
            closeGroupsMenuBtn.onclick = () => {
                closeAllGroupsView();
            };
        }

        if (groupsMenu) {
            groupsMenu.addEventListener('click', (event) => {
                if (event.target === groupsMenu) {
                    closeAllGroupsView();
                }
            });
        }

        if (nextMatchBtn) {
            nextMatchBtn.onclick = () => {
                const nextMatch = fixtures.find(match => `${match.date} ${match.timeUK}` >= `${selectedDate} ${new Date().toTimeString().slice(0, 5)}` || match.date > selectedDate);
                if (nextMatch) {
                    setDate(nextMatch.date);
                    setTimeout(() => {
                        const matchElements = document.querySelectorAll('.match');
                        if (matchElements.length > 0) {
                            matchElements[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 100);
                }
            };
        }

        function renderAllMatchesList() {
            if (!fixtures.length) {
                listMenuContent.innerHTML = '<div class="empty">No matches available</div>';
                return;
            }

            const dates = getSortedUniqueDates();
            let html = '';

            dates.forEach(date => {
                const dayMatches = fixtures.filter(match => match.date === date);
                if (!dayMatches.length) return;

                const headingDate = new Date(`${date}T12:00:00`).toLocaleDateString('en-GB', {
                    weekday: 'long', day: 'numeric', month: 'long'
                });

                html += `<div class="listDayHeader">${getDayNumberLabel(date)} · ${headingDate}</div>`;
                html += dayMatches.map(match => {
                    const tzConversion = convertTimeToTimezone(match.date, match.timeUK, match.venueCity, selectedTimezone);
                    const displayTime = selectedTimezone === 'Europe/London' ? match.timeUK : tzConversion.time;
                    const displayDate = selectedTimezone === 'Europe/London' ? match.date : tzConversion.date;
                    const formattedDate = new Date(displayDate + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });
                    const dayChangeNote = (tzConversion.date !== match.date && selectedTimezone !== 'Europe/London')
                        ? ` (${tzConversion.day.substring(0, 3)})`
                        : '';
                    return `
                    <div class="listMatchItem ${getBroadcasterClass(match.broadcast)} ${isMatchFinished(match) ? 'finished' : ''}" data-matchno="${match.matchNo || ''}" data-group="${match.group || ''}" data-date="${match.date || ''}">
                        <div class="listMatchInfo">
                            <div class="listMatchTeams">${renderTeam(match.teams?.[0], match, 0)} <span class="scorePill">${getMatchScoreText(match)}</span> ${renderTeam(match.teams?.[1], match, 1)}</div>
                            <div class="listMatchMeta">${shortWeekday(match)} ${formattedDate} · ${displayTime}${dayChangeNote}${match.group ? ` · Group ${match.group}` : ''} · ${match.round}</div>
                        </div>
                        <div class="listMatchBroadcast">${getBroadcasterIcon(match.broadcast)} ${match.broadcast || 'TBC'}</div>
                    </div>
                `;
                }).join('');
            });

            listMenuContent.innerHTML = html;

            listMenuContent.querySelectorAll('.listMatchItem').forEach(item => {
                item.onclick = () => {
                    const date = item.dataset.date || '';
                    const matchNo = item.dataset.matchno || '';
                    listMenu.classList.remove('open');
                    const match = fixtures.find(m => String(m.matchNo || '') === String(matchNo || '') && (!date || m.date === date));
                    goToMatch(match);
                };
            });
        }

        function renderFloatingMenu() {
            const allMatches = fixtures;
            if (!allMatches.length) {
                floatingMenuContent.innerHTML = '<div class="empty">No matches available</div>';
                return;
            }

            const sortedMatches = [...allMatches].sort((a, b) => `${a.date} ${a.timeUK}`.localeCompare(`${b.date} ${b.timeUK}`));
            const tiles = sortedMatches.map(match => {
                const teamA = match.teams?.[0] || 'TBD';
                const teamB = match.teams?.[1] || 'TBD';
                const outcomeA = teamA !== 'TBD' ? getMatchOutcome(match, 0) : null;
                const outcomeB = teamB !== 'TBD' ? getMatchOutcome(match, 1) : null;
                const flagA = FLAGS[teamA] || '<span class="mosaicVs">TBD</span>';
                const flagB = FLAGS[teamB] || '<span class="mosaicVs">TBD</span>';
                const flagAHtml = outcomeA ? `<span class="flag-${outcomeA}">${flagA}</span>` : flagA;
                const flagBHtml = outcomeB ? `<span class="flag-${outcomeB}">${flagB}</span>` : flagB;
                const centerLabel = getMatchScoreText(match) === 'vs' ? 'v' : getMatchScoreText(match);
                const tzConversion = convertTimeToTimezone(match.date, match.timeUK, match.venueCity, selectedTimezone);
                const displayTime = selectedTimezone === 'Europe/London' ? match.timeUK : tzConversion.time;
                const displayDate = selectedTimezone === 'Europe/London' ? match.date : tzConversion.date;
                const dateObj = new Date(displayDate + 'T00:00:00');
                const dayShort = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][dateObj.getUTCDay()];
                const when = `${dayShort} ${dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}`.trim();
                const bcClass = getBroadcasterClass(match.broadcast);
                return `
                    <button class="mosaicCard ${bcClass} ${isMatchFinished(match) ? 'finished' : ''}" data-matchno="${match.matchNo || ''}" data-date="${match.date || ''}" data-group="${match.group || ''}" type="button">
                        <div class="mosaicFlags">
                            <span class="mosaicFlag">${flagAHtml}</span>
                            <span class="mosaicVs">${centerLabel}</span>
                            <span class="mosaicFlag">${flagBHtml}</span>
                        </div>
                        <div class="mosaicMeta">${when} · ${displayTime || ''}</div>
                    </button>
                `;
            }).join('');

            floatingMenuContent.innerHTML = `
                <div class="mosaicLegend">
                    <span class="mosaicLegendChip bc-bbc">BBC iPlayer</span>
                    <span class="mosaicLegendChip bc-itv">ITV/STV</span>
                    <span class="mosaicLegendChip bc-tbc">TBC</span>
                    <span class="mosaicLegendChip">Score shown when finished</span>
                </div>
                <div class="mosaicGrid">${tiles}</div>
            `;

            floatingMenuContent.querySelectorAll('.mosaicCard').forEach(item => {
                item.onclick = () => {
                    const date = item.dataset.date || '';
                    const matchNo = item.dataset.matchno || '';
                    floatingMenu.classList.remove('open');
                    const match = fixtures.find(m => String(m.matchNo || '') === String(matchNo || '') && (!date || m.date === date));
                    goToMatch(match);
                };
            });
        }

        function renderTeamShort(team) {
            if (!team) return '';
            return `${FLAGS[team] || '🏳️'}<span style="margin-left: 4px;">${getShortName(team)}</span>`;
        }

        function getBroadcasterIcon(broadcast) {
            if (!broadcast) return '';
            const bc = broadcast.toUpperCase();
            if (bc.includes('BBC')) return '<img src="broadcasts/bbc.svg" alt="BBC" />';
            if (bc.includes('ITV')) return '<img src="broadcasts/itv.svg" alt="ITV" />';
            if (bc.includes('STV')) return '<img src="broadcasts/stv.svg" alt="STV" />';
            return '';
        }

        function getBroadcasterClass(broadcast) {
            if (!broadcast) return 'bc-tbc';
            const bc = broadcast.toUpperCase();
            if (bc.includes('BBC')) return 'bc-bbc';
            if (bc.includes('ITV') || bc.includes('STV')) return 'bc-itv';
            return 'bc-tbc';
        }

        document.getElementById('prevDay').onclick = () => jumpToMatchDay(-1);
        document.getElementById('nextDay').onclick = () => jumpToMatchDay(1);
        document.getElementById('todayBtn').onclick = () => jumpToTodayOrNextMatchDay();
        calendarBtn.onclick = () => toggleCalendarCard();
        if (timezoneMenuBtn) {
            timezoneMenuBtn.onclick = () => toggleTimezoneMenu();
            renderTimezoneMenu();
        }
        if (groupMenuBtn) {
            groupMenuBtn.onclick = () => toggleGroupMenu();
        }
        if (teamMenuBtn) {
            teamMenuBtn.onclick = () => toggleTeamMenu();
        }
        calendarPrevMonth.onclick = () => {
            calendarMonthCursor = new Date(calendarMonthCursor.getFullYear(), calendarMonthCursor.getMonth() - 1, 1);
            renderCalendarCard();
        };
        calendarNextMonth.onclick = () => {
            calendarMonthCursor = new Date(calendarMonthCursor.getFullYear(), calendarMonthCursor.getMonth() + 1, 1);
            renderCalendarCard();
        };
        document.addEventListener('click', (event) => {
            const target = event.target;

            if (calendarCard.classList.contains('open') && !(calendarCard.contains(target) || calendarBtn.contains(target))) {
                closeCalendarCard();
            }

            if (timezoneMenuPanel && timezoneMenuPanel.classList.contains('open') && timezoneMenuWrap && !timezoneMenuWrap.contains(target)) {
                closeTimezoneMenu();
            }

            if (groupMenuPanel && groupMenuPanel.classList.contains('open') && groupMenuWrap && !groupMenuWrap.contains(target)) {
                closeGroupMenu();
            }

            if (teamMenuPanel && teamMenuPanel.classList.contains('open') && teamMenuWrap && !teamMenuWrap.contains(target)) {
                closeTeamMenu();
            }
        });
        datePicker.onchange = () => setDate(datePicker.value);

        if (clearFiltersBtn) {
            clearFiltersBtn.onclick = () => {
                selectedTeams = [];
                selectedGroup = '';
                stopGroupLiveRefresh();
                saveFiltersToCookie();
                render();
                closeGroupMenu();
                closeTeamMenu();
            };
        }

        // Remove any old service worker/cache from the previous version.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister()));
        }
        if ('caches' in window) {
            caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
        }

        fetch(`fixtures.json?cacheBust=${Date.now()}`, { cache: 'no-store' })
            .then(response => response.json())
            .then(data => {
                fixtures = data.sort((a, b) => `${a.date} ${a.timeUK}`.localeCompare(`${b.date} ${b.timeUK}`));

                // Fetch live scores from SportsDB in background
                fetchLiveScores({ recentOnly: false })
                    .then(scoreMap => {
                        mergeScores(scoreMap);
                        render();
                    })
                    .catch(() => {
                        // Render with local data if SportsDB fails
                    });

                const availableDates = new Set(fixtures.map(match => match.date));

                if (!availableDates.has(selectedDate)) {
                    const today = isoToday();
                    if (availableDates.has(today)) {
                        selectedDate = today;
                    } else {
                        selectedDate = [...availableDates][0] || today;
                    }
                }

                datePicker.value = selectedDate;

                if (selectedGroup) {
                    startGroupLiveRefresh();
                } else {
                    stopGroupLiveRefresh();
                }
                render();
            })
            .catch(error => {
                matches.innerHTML = '<div class="empty">Could not load fixtures.json. Make sure it is in the same folder as index.html.</div>';
                console.error(error);
            });
    </script>
</body>

</html>
