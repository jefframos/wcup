<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Cup 2026 UK TV Guide</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 14px 12px;
            background: rgba(248, 250, 252, .97);
            border-bottom: 1px solid #e2e8f0;
            backdrop-filter: blur(10px);
        }

        h1 {
            margin: 0 0 4px;
            font-size: 20px;
            letter-spacing: -0.03em;
        }

        .hint {
            margin: 0 0 12px;
            color: #64748b;
            font-size: 13px;
        }

        .dateNav {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .dateNav button,
        .today,
        .teamChip {
            border: 1px solid #e2e8f0;
            border-radius: 999px;
            padding: 11px 12px;
            font: inherit;
            font-weight: 800;
            background: #fff;
            color: #0f172a;
        }

        .dateNav button {
            background: #0f172a;
            color: white;
            border-color: #0f172a;
        }

        .today {
            width: 100%;
            margin-bottom: 10px;
        }

        .dateLine {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .dateLine strong {
            font-size: 17px;
        }

        input[type="date"] {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 8px;
            background: #fff;
            font: inherit;
            max-width: 145px;
        }

        .chips {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 2px 0 4px;
        }

        .teamChip {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .teamChip.active {
            background: #0f172a;
            color: #fff;
            border-color: #0f172a;
        }

        .flag {
            font-size: 22px;
            line-height: 1;
        }

        .flag-img {
            width: 22px;
            height: 16px;
            vertical-align: middle;
            margin-right: 2px;
        }

        main {
            padding: 12px;
            max-width: 780px;
            margin: 0 auto;
        }

        .summary {
            color: #64748b;
            font-size: 14px;
            margin: 0 0 10px;
        }

        .match {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 14px;
            margin: 10px 0;
            box-shadow: 0 8px 18px rgba(15, 23, 42, .05);
        }

        .matchTop {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
        }

        .fixture {
            font-size: 18px;
            font-weight: 950;
            letter-spacing: -0.02em;
        }

        .time {
            font-size: 22px;
            font-weight: 950;
            white-space: nowrap;
        }

        .meta {
            color: #64748b;
            font-size: 13px;
            margin-top: 4px;
        }

        .scorePill {
            display: inline-block;
            margin: 0 6px;
            padding: 2px 8px;
            border-radius: 999px;
            background: #0f172a;
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            vertical-align: middle;
        }

        .tv {
            margin-top: 12px;
            padding: 11px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
        }

        .tv strong {
            display: block;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tv strong img {
            height: 20px;
            width: auto;
        }

        .stream {
            color: #64748b;
            font-size: 13px;
            margin-top: 3px;
        }

        .empty {
            text-align: center;
            color: #64748b;
            background: #fff;
            border: 1px dashed #cbd5e1;
            border-radius: 18px;
            padding: 28px 16px;
        }

        .nextMatchBtn {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: #0f172a;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.3);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .nextMatchBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.4);
        }

        .allMatchesBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: #0f172a;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.3);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .allMatchesBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.4);
        }

        .floatingMenu {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50vh;
            background: #fff;
            border-top: 2px solid #e2e8f0;
            box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.1);
            z-index: 15;
            display: none;
            flex-direction: column;
            border-radius: 24px 24px 0 0;
        }

        .floatingMenu.open {
            display: flex;
        }

        .floatingMenuHeader {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .floatingMenuHeader h2 {
            margin: 0;
            font-size: 18px;
        }

        .floatingMenuHeader button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #64748b;
        }

        .floatingMenuContent {
            overflow-y: auto;
            flex: 1;
            padding: 8px 12px;
            -webkit-overflow-scrolling: touch;
        }

        .floatingMatchItem {
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .floatingMatchItem.clickable {
            cursor: pointer;
        }

        .floatingMatchItem.clickable:hover {
            background: #f8fafc;
        }

        .floatingDayHeader {
            position: sticky;
            top: 0;
            z-index: 1;
            padding: 10px 12px;
            margin: 0 -12px;
            background: #e2e8f0;
            color: #0f172a;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .floatingMatchItem:last-child {
            border-bottom: none;
        }

        .floatingMatchInfo {
            flex: 1;
        }

        .floatingMatchTeams {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .floatingMatchMeta {
            font-size: 12px;
            color: #64748b;
        }

        .floatingMatchBroadcast {
            font-size: 12px;
            color: #0f172a;
            font-weight: 500;
            text-align: right;
            min-width: 80px;
        }

        main {
            padding-bottom: 80px;
        }

        .standings {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 16px;
            margin: 10px 0;
            box-shadow: 0 8px 18px rgba(15, 23, 42, .05);
        }

        .standings h3 {
            margin: 0 0 12px;
            font-size: 16px;
        }

        .standings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .standings-table thead {
            background: #f1f5f9;
        }

        .standings-table th {
            padding: 8px 6px;
            text-align: left;
            font-weight: 600;
            color: #0f172a;
            border-bottom: 1px solid #e2e8f0;
        }

        .standings-table td {
            padding: 8px 6px;
            border-bottom: 1px solid #f1f5f9;
        }

        .standings-table tr:last-child td {
            border-bottom: none;
        }

        .standings-team {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .standings-team img {
            width: 16px;
            height: 12px;
        }

        .standings-pos {
            font-weight: 600;
            color: #64748b;
            width: 24px;
        }

        .standings-pts {
            font-weight: 600;
            color: #0f172a;
            width: 30px;
        }

        .standings-stat {
            text-align: center;
            width: 30px;
            color: #64748b;
        }

        .backBtn {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #0f172a;
            margin-right: 8px;
            display: none;
        }

        .backBtn:hover {
            background: #e2e8f0;
        }

        .backBtn.visible {
            display: inline-block;
        }

        .dateLine {
            display: flex;
            align-items: center;
            gap: 12px;
        }
    </style>
</head>

<body>
    <header>
        <h1>World Cup 2026 UK TV Guide</h1>
        <p class="hint">UK times · UK broadcasters · tap a flag to filter</p>

        <div class="dateNav">
            <button id="prevDay">← Previous match day</button>
            <button id="nextDay">Next match day →</button>
        </div>
        <button class="today" id="todayBtn">Today</button>

        <div class="dateLine">
            <button class="backBtn" id="backBtn">← Back</button>
            <strong id="dateLabel"></strong>
            <input id="datePicker" type="date" />
        </div>

        <div class="chips" id="teamChips"></div>
    </header>

    <main>
        <p class="summary" id="summary"></p>
        <section id="matches"></section>
    </main>

    <button class="nextMatchBtn" id="nextMatchBtn" title="Scroll to next match">⏭️</button>
    <button class="allMatchesBtn" id="allMatchesBtn" title="Show all matches">📋</button>
    <div class="floatingMenu" id="floatingMenu">
        <div class="floatingMenuHeader">
            <h2>All Matches</h2>
            <button id="closeMenuBtn">✕</button>
        </div>
        <div class="floatingMenuContent" id="floatingMenuContent"></div>
    </div>

    <script>
        // Edit this list to the countries you follow.
        const FOLLOWED_TEAMS = ['England', 'Scotland', 'Brazil', 'Argentina', 'France', 'Spain', 'Portugal', 'USA'];

        const FLAGS = {
            'Algeria': '<img src="flags/algeria.svg" alt="Algeria" class="flag-img"/>',
            'Argentina': '<img src="flags/argentina.svg" alt="Argentina" class="flag-img"/>',
            'Australia': '<img src="flags/australia.svg" alt="Australia" class="flag-img"/>',
            'Austria': '<img src="flags/austria.svg" alt="Austria" class="flag-img"/>',
            'Belgium': '<img src="flags/belgium.svg" alt="Belgium" class="flag-img"/>',
            'Bosnia-Herzegovina': '<img src="flags/bosnia-herzegovina.svg" alt="Bosnia-Herzegovina" class="flag-img"/>',
            'Brazil': '<img src="flags/brazil.svg" alt="Brazil" class="flag-img"/>',
            'Canada': '<img src="flags/canada.svg" alt="Canada" class="flag-img"/>',
            'Cape Verde': '<img src="flags/capeverde.svg" alt="Cape Verde" class="flag-img"/>',
            'Colombia': '<img src="flags/colombia.svg" alt="Colombia" class="flag-img"/>',
            'Croatia': '<img src="flags/croatia.svg" alt="Croatia" class="flag-img"/>',
            'Curacao': '<img src="flags/curacao.svg" alt="Curacao" class="flag-img"/>',
            'Czech Republic': '<img src="flags/czechrepublic.svg" alt="Czech Republic" class="flag-img"/>',
            'DR Congo': '<img src="flags/drcongo.svg" alt="DR Congo" class="flag-img"/>',
            'Ecuador': '<img src="flags/ecuador.svg" alt="Ecuador" class="flag-img"/>',
            'Egypt': '<img src="flags/egypt.svg" alt="Egypt" class="flag-img"/>',
            'England': '<img src="flags/england.svg" alt="England" class="flag-img"/>',
            'France': '<img src="flags/france.svg" alt="France" class="flag-img"/>',
            'Germany': '<img src="flags/germany.svg" alt="Germany" class="flag-img"/>',
            'Ghana': '<img src="flags/ghana.svg" alt="Ghana" class="flag-img"/>',
            'Haiti': '<img src="flags/haiti.svg" alt="Haiti" class="flag-img"/>',
            'Iran': '<img src="flags/iran.svg" alt="Iran" class="flag-img"/>',
            'Iraq': '<img src="flags/iraq.svg" alt="Iraq" class="flag-img"/>',
            'Ivory Coast': '<img src="flags/ivorycoast.svg" alt="Ivory Coast" class="flag-img"/>',
            'Japan': '<img src="flags/japan.svg" alt="Japan" class="flag-img"/>',
            'Jordan': '<img src="flags/jordan.svg" alt="Jordan" class="flag-img"/>',
            'Mexico': '<img src="flags/mexico.svg" alt="Mexico" class="flag-img"/>',
            'Morocco': '<img src="flags/morocco.svg" alt="Morocco" class="flag-img"/>',
            'Netherlands': '<img src="flags/netherlands.svg" alt="Netherlands" class="flag-img"/>',
            'New Zealand': '<img src="flags/newzealand.svg" alt="New Zealand" class="flag-img"/>',
            'Norway': '<img src="flags/norway.svg" alt="Norway" class="flag-img"/>',
            'Panama': '<img src="flags/panama.svg" alt="Panama" class="flag-img"/>',
            'Paraguay': '<img src="flags/paraguay.svg" alt="Paraguay" class="flag-img"/>',
            'Portugal': '<img src="flags/portugal.svg" alt="Portugal" class="flag-img"/>',
            'Qatar': '<img src="flags/qatar.svg" alt="Qatar" class="flag-img"/>',
            'Saudi Arabia': '<img src="flags/saudiarabia.svg" alt="Saudi Arabia" class="flag-img"/>',
            'Scotland': '<img src="flags/scotland.svg" alt="Scotland" class="flag-img"/>',
            'Senegal': '<img src="flags/senegal.svg" alt="Senegal" class="flag-img"/>',
            'South Africa': '<img src="flags/southafrica.svg" alt="South Africa" class="flag-img"/>',
            'South Korea': '<img src="flags/southkorea.svg" alt="South Korea" class="flag-img"/>',
            'Spain': '<img src="flags/spain.svg" alt="Spain" class="flag-img"/>',
            'Sweden': '<img src="flags/sweden.svg" alt="Sweden" class="flag-img"/>',
            'Switzerland': '<img src="flags/switzerland.svg" alt="Switzerland" class="flag-img"/>',
            'Tunisia': '<img src="flags/tunisia.svg" alt="Tunisia" class="flag-img"/>',
            'Turkey': '<img src="flags/turkey.svg" alt="Turkey" class="flag-img"/>',
            'USA': '<img src="flags/usa.svg" alt="USA" class="flag-img"/>',
            'Uruguay': '<img src="flags/uruguay.svg" alt="Uruguay" class="flag-img"/>',
            'Uzbekistan': '<img src="flags/uzbekistan.svg" alt="Uzbekistan" class="flag-img"/>'
        };


        let fixtures = [];
        let selectedDate = isoToday();
        let selectedTeam = '';
        let selectedGroup = '';
        let liveRefreshTimer = null;
        let previousSelectedDate = '';
        let previousSelectedTeam = '';
        let previousSelectedGroup = '';

        const datePicker = document.getElementById('datePicker');
        const dateLabel = document.getElementById('dateLabel');
        const teamChips = document.getElementById('teamChips');
        const matches = document.getElementById('matches');
        const summary = document.getElementById('summary');
        const backBtn = document.getElementById('backBtn');

        function isoToday() {
            const d = new Date();
            return toIsoDate(d);
        }

        function toIsoDate(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function addDays(isoDate, days) {
            const d = new Date(`${isoDate}T12:00:00`);
            d.setDate(d.getDate() + days);
            return toIsoDate(d);
        }

        function getMatchDatesForCurrentFilter() {
            const dates = fixtures
                .filter(match => !selectedTeam || (match.teams || []).includes(selectedTeam))
                .map(match => match.date);
            return [...new Set(dates)].sort();
        }

        function jumpToMatchDay(direction) {
            const matchDates = getMatchDatesForCurrentFilter();
            if (!matchDates.length) return;

            let target;
            if (direction > 0) {
                target = matchDates.find(date => date > selectedDate) || matchDates[0];
            } else {
                target = [...matchDates].reverse().find(date => date < selectedDate) || matchDates[matchDates.length - 1];
            }
            setDate(target);
        }

        function jumpToTodayOrNextMatchDay() {
            const today = isoToday();
            const matchDates = getMatchDatesForCurrentFilter();
            const target = matchDates.find(date => date >= today) || matchDates[matchDates.length - 1] || today;
            setDate(target);
        }

        function prettyDate(isoDate) {
            return new Date(`${isoDate}T12:00:00`).toLocaleDateString('en-GB', {
                weekday: 'long', day: 'numeric', month: 'long'
            });
        }

        function getSortedUniqueDates() {
            return [...new Set(fixtures.map(match => match.date))].sort();
        }

        function getDayNumberLabel(isoDate) {
            const dates = getSortedUniqueDates();
            const idx = dates.indexOf(isoDate);
            return idx >= 0 ? `DAY ${idx + 1}` : 'DAY ?';
        }

        function setDate(isoDate) {
            selectedDate = isoDate;
            datePicker.value = selectedDate;
            render();
        }

        function renderChips() {
            teamChips.innerHTML = '';

            // Get all unique groups
            const groups = [...new Set(fixtures.filter(m => m.group).map(m => m.group))].sort();

            // Render group tabs
            const groupsSection = document.createElement('div');
            groupsSection.style.marginBottom = '8px';
            groupsSection.style.display = 'flex';
            groupsSection.style.gap = '6px';
            groupsSection.style.overflowX = 'auto';
            groupsSection.style.paddingBottom = '4px';
            groupsSection.style.WebkitOverflowScrolling = 'touch';

            const groupAllBtn = document.createElement('button');
            groupAllBtn.className = 'teamChip' + (selectedGroup === '' ? ' active' : '');
            groupAllBtn.innerHTML = 'Groups';
            groupAllBtn.onclick = () => {
                selectedGroup = '';
                selectedTeam = '';
                render();
            };
            groupsSection.appendChild(groupAllBtn);

            groups.forEach(group => {
                const btn = document.createElement('button');
                btn.className = 'teamChip' + (selectedGroup === group ? ' active' : '');
                btn.textContent = `Group ${group}`;
                btn.onclick = () => {
                    selectedGroup = group;
                    selectedTeam = '';
                    startGroupLiveRefresh();
                    render();
                };
                groupsSection.appendChild(btn);
            });

            teamChips.appendChild(groupsSection);

            // Render team chips
            const teamSection = document.createElement('div');
            teamSection.style.display = 'flex';
            teamSection.style.gap = '8px';
            teamSection.style.overflowX = 'auto';
            teamSection.style.paddingBottom = '4px';
            teamSection.style.WebkitOverflowScrolling = 'touch';

            const allTeamBtn = document.createElement('button');
            allTeamBtn.className = 'teamChip' + (selectedTeam === '' && selectedGroup === '' ? ' active' : '');
            allTeamBtn.innerHTML = '🌍<span>All</span>';
            allTeamBtn.onclick = () => {
                selectedTeam = '';
                selectedGroup = '';
                stopGroupLiveRefresh();
                render();
            };
            teamSection.appendChild(allTeamBtn);

            FOLLOWED_TEAMS.forEach(team => {
                teamSection.appendChild(makeChip(team, FLAGS[team] || '🏳️', team));
            });

            teamChips.appendChild(teamSection);
        }

        function makeChip(team, flag, label) {
            const button = document.createElement('button');
            button.className = 'teamChip' + (team === selectedTeam ? ' active' : '');
            button.dataset.team = team;
            button.innerHTML = `<span class="flag">${flag}</span><span>${getShortName(label)}</span>`;
            button.onclick = () => {
                selectedTeam = team;
                selectedGroup = '';
                stopGroupLiveRefresh();
                render();
            };
            return button;
        }

        function getShortName(name) {
            const SHORTS = {
                'Algeria': 'ALG', 'Argentina': 'ARG', 'Australia': 'AUS', 'Austria': 'AUT', 'Belgium': 'BEL',
                'Bosnia-Herzegovina': 'BIH', 'Brazil': 'BRA', 'Canada': 'CAN', 'Cape Verde': 'CPV', 'Colombia': 'COL',
                'Croatia': 'CRO', 'Curacao': 'CUW', 'Czech Republic': 'CZE', 'DR Congo': 'COD', 'Ecuador': 'ECU',
                'Egypt': 'EGY', 'England': 'ENG', 'France': 'FRA', 'Germany': 'GER', 'Ghana': 'GHA',
                'Haiti': 'HTI', 'Iran': 'IRN', 'Iraq': 'IRQ', 'Ivory Coast': 'CIV', 'Japan': 'JPN',
                'Jordan': 'JOR', 'Mexico': 'MEX', 'Morocco': 'MAR', 'Netherlands': 'NED', 'New Zealand': 'NZL',
                'Norway': 'NOR', 'Panama': 'PAN', 'Paraguay': 'PAR', 'Portugal': 'POR', 'Qatar': 'QAT',
                'Saudi Arabia': 'KSA', 'Scotland': 'SCO', 'Senegal': 'SEN', 'South Africa': 'RSA', 'South Korea': 'KOR',
                'Spain': 'ESP', 'Sweden': 'SWE', 'Switzerland': 'SUI', 'Tunisia': 'TUN', 'Turkey': 'TUR',
                'USA': 'USA', 'Uruguay': 'URU', 'Uzbekistan': 'UZB'
            };
            return SHORTS[name] || name;
        }

        function getGroupTeams(group) {
            const teams = new Set();
            fixtures.filter(m => m.group === group).forEach(m => {
                if (m.teams) m.teams.forEach(t => teams.add(t));
            });
            return Array.from(teams);
        }

        function getVisibleMatches() {
            return fixtures.filter(match => {
                if (selectedGroup) {
                    // When a group is selected, show all matches for that group
                    return match.group === selectedGroup;
                } else if (selectedTeam) {
                    // When a team is selected, show all matches for that team
                    return (match.teams || []).includes(selectedTeam);
                } else {
                    // When "All" is selected, show matches for the selected date
                    return match.date === selectedDate;
                }
            });
        }

        function render() {
            // Show or hide back button based on whether there's a previous state
            const hasPreviousState = previousSelectedDate || previousSelectedTeam || previousSelectedGroup;
            if (hasPreviousState) {
                backBtn.classList.add('visible');
            } else {
                backBtn.classList.remove('visible');
            }

            dateLabel.textContent = `${selectedDate === isoToday() ? 'Today · ' : ''}${prettyDate(selectedDate)}`;
            summary.innerHTML = '';
            renderChips();

            const rows = getVisibleMatches();

            let summaryText = '';
            if (selectedGroup) {
                const groupTeams = getGroupTeams(selectedGroup);
                summaryText = `Group ${selectedGroup} · ${groupTeams.length} teams · live refresh every 60s`;
            } else if (selectedTeam) {
                summaryText = `${rows.length} match${rows.length === 1 ? '' : 'es'} · ${FLAGS[selectedTeam] || ''} ${selectedTeam}`;
            } else {
                summaryText = `${rows.length} match${rows.length === 1 ? '' : 'es'} on ${prettyDate(selectedDate)}`;
            }

            summary.innerHTML = summaryText;

            if (!rows.length) {
                matches.innerHTML = '<div class="empty">No matches for this day/filter. Use Next match day or choose All.</div>';
                return;
            }

            // Build standings + matches if group is selected
            let htmlContent = '';
            if (selectedGroup) {
                const standings = buildGroupStandingsHTML(selectedGroup);
                htmlContent = standings;
            }

            htmlContent += rows.map(match => `
        <article class="match" data-group="${match.group}" style="cursor: pointer;">
          <div class="matchTop">
            <div>
              <div class="fixture">
                                ${renderTeam(match.teams?.[0])} <span class="scorePill">${getMatchScoreText(match)}</span> ${renderTeam(match.teams?.[1])}
              </div>
                            <div class="meta">${getDayNumberLabel(match.date)} · ${match.day} ${match.date ? new Date(match.date + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }) : ''} · ${match.round}${match.group ? ` · Group ${match.group}` : ''}</div>
            </div>
            <div class="time">${match.timeUK}</div>
          </div>
          <div class="tv">
            <strong>${getBroadcasterIcon(match.broadcast)} ${match.broadcast || 'TBC'}</strong>
            ${match.streaming ? `<div class="stream">${match.streaming}</div>` : ''}
          </div>
        </article>
      `).join('');

            matches.innerHTML = htmlContent;

            // Make match cards clickable to navigate to group
            document.querySelectorAll('.match').forEach(card => {
                card.addEventListener('click', () => {
                    const group = card.dataset.group;
                    if (group) {
                        // Save current state before changing
                        previousSelectedDate = selectedDate;
                        previousSelectedTeam = selectedTeam;
                        previousSelectedGroup = selectedGroup;

                        selectedGroup = group;
                        selectedTeam = '';
                        render();
                    }
                });
            });

            function renderTeam(team) {
                if (!team) return '';
                return `<span class='flag'>${FLAGS[team] || '🏳️'}</span><span>${getShortName(team)}</span>`;
            }
        }

        function buildGroupStandingsHTML(group) {
            const teamIds = getGroupTeams(group);
            const groupMatches = fixtures.filter(m => m.group === group);

            // Initialize standings data
            const standings = {};
            teamIds.forEach(team => {
                standings[team] = { P: 0, W: 0, D: 0, L: 0, GF: 0, GA: 0, GD: 0, Pts: 0 };
            });

            // Calculate standings from matches
            groupMatches.forEach(match => {
                const teams = match.teams;
                if (teams && teams.length === 2) {
                    const [team1, team2] = teams;
                    const score = getNumericScore(match);
                    if (!score) {
                        return;
                    }

                    standings[team1].P++;
                    standings[team2].P++;
                    standings[team1].GF += score.home;
                    standings[team1].GA += score.away;
                    standings[team2].GF += score.away;
                    standings[team2].GA += score.home;

                    if (score.home > score.away) {
                        standings[team1].W++;
                        standings[team1].Pts += 3;
                        standings[team2].L++;
                    } else if (score.home < score.away) {
                        standings[team2].W++;
                        standings[team2].Pts += 3;
                        standings[team1].L++;
                    } else {
                        standings[team1].D++;
                        standings[team2].D++;
                        standings[team1].Pts += 1;
                        standings[team2].Pts += 1;
                    }

                    standings[team1].GD = standings[team1].GF - standings[team1].GA;
                    standings[team2].GD = standings[team2].GF - standings[team2].GA;
                }
            });

            // Sort by points (desc), then by goal difference (desc), then by goals for (desc)
            const sorted = Object.entries(standings).sort((a, b) => {
                if (b[1].Pts !== a[1].Pts) return b[1].Pts - a[1].Pts;
                if (b[1].GD !== a[1].GD) return b[1].GD - a[1].GD;
                return b[1].GF - a[1].GF;
            });

            const tableHTML = `
                <div class="standings">
                    <h3>Group ${group} Standings</h3>
                    <table class="standings-table">
                        <thead>
                            <tr>
                                <th style="width: 30px;">Pos</th>
                                <th>Team</th>
                                <th class="standings-stat">P</th>
                                <th class="standings-stat">W</th>
                                <th class="standings-stat">D</th>
                                <th class="standings-stat">L</th>
                                <th class="standings-stat">GF</th>
                                <th class="standings-stat">GA</th>
                                <th class="standings-stat">GD</th>
                                <th class="standings-pts">Pts</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sorted.map((entry, idx) => {
                const team = entry[0];
                const stats = entry[1];
                return `
                                    <tr>
                                        <td class="standings-pos">${idx + 1}</td>
                                        <td>
                                            <div class="standings-team">
                                                ${FLAGS[team] || '🏳️'}
                                                <span>${getShortName(team)}</span>
                                            </div>
                                        </td>
                                        <td class="standings-stat">${stats.P}</td>
                                        <td class="standings-stat">${stats.W}</td>
                                        <td class="standings-stat">${stats.D}</td>
                                        <td class="standings-stat">${stats.L}</td>
                                        <td class="standings-stat">${stats.GF}</td>
                                        <td class="standings-stat">${stats.GA}</td>
                                        <td class="standings-stat">${stats.GD > 0 ? '+' : ''}${stats.GD}</td>
                                        <td class="standings-pts">${stats.Pts}</td>
                                    </tr>
                                `;
            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            return tableHTML;
        }

        function getNumericScore(match) {
            if (typeof match.homeScore === 'number' && typeof match.awayScore === 'number') {
                return { home: match.homeScore, away: match.awayScore };
            }

            if (match.score && typeof match.score.home === 'number' && typeof match.score.away === 'number') {
                return { home: match.score.home, away: match.score.away };
            }

            if (typeof match.result === 'string') {
                const m = match.result.match(/(\d+)\s*[-:]\s*(\d+)/);
                if (m) {
                    return { home: Number(m[1]), away: Number(m[2]) };
                }
            }

            return null;
        }

        function getMatchScoreText(match) {
            const score = getNumericScore(match);
            if (!score) {
                return 'vs';
            }
            return `${score.home}-${score.away}`;
        }

        function stopGroupLiveRefresh() {
            if (liveRefreshTimer) {
                clearInterval(liveRefreshTimer);
                liveRefreshTimer = null;
            }
        }

        function startGroupLiveRefresh() {
            stopGroupLiveRefresh();
            refreshFixturesNow();
            liveRefreshTimer = setInterval(() => {
                if (selectedGroup) {
                    refreshFixturesNow();
                }
            }, 60000);
        }

        function refreshFixturesNow() {
            fetch(`fixtures.json?cacheBust=${Date.now()}`, { cache: 'no-store' })
                .then(response => response.json())
                .then(data => {
                    fixtures = data.sort((a, b) => `${a.date} ${a.timeUK}`.localeCompare(`${b.date} ${b.timeUK}`));
                    render();
                })
                .catch(() => {
                    // Keep current data if refresh fails.
                });
        }

        function ensureFloatingMenuElements() {
            let menu = document.getElementById('floatingMenu');
            if (!menu) {
                menu = document.createElement('div');
                menu.id = 'floatingMenu';
                menu.className = 'floatingMenu';
                menu.innerHTML = `
                    <div class="floatingMenuHeader">
                        <h2>All Matches</h2>
                        <button id="closeMenuBtn">✕</button>
                    </div>
                    <div class="floatingMenuContent" id="floatingMenuContent"></div>
                `;
                document.body.appendChild(menu);
            }
            return menu;
        }

        const floatingMenu = ensureFloatingMenuElements();
        const floatingMenuContent = document.getElementById('floatingMenuContent');
        const allMatchesBtn = document.getElementById('allMatchesBtn');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const nextMatchBtn = document.getElementById('nextMatchBtn');

        if (allMatchesBtn) {
            allMatchesBtn.onclick = () => {
                floatingMenu.classList.add('open');
                renderFloatingMenu();
            };
        }

        if (closeMenuBtn) {
            closeMenuBtn.onclick = () => {
                floatingMenu.classList.remove('open');
            };
        }

        backBtn.addEventListener('click', () => {
            selectedDate = previousSelectedDate;
            selectedTeam = previousSelectedTeam;
            selectedGroup = previousSelectedGroup;
            previousSelectedDate = '';
            previousSelectedTeam = '';
            previousSelectedGroup = '';
            render();
        });

        if (nextMatchBtn) {
            nextMatchBtn.onclick = () => {
                const nextMatch = fixtures.find(match => `${match.date} ${match.timeUK}` >= `${selectedDate} ${new Date().toTimeString().slice(0, 5)}` || match.date > selectedDate);
                if (nextMatch) {
                    setDate(nextMatch.date);
                    setTimeout(() => {
                        const matchElements = document.querySelectorAll('.match');
                        if (matchElements.length > 0) {
                            matchElements[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 100);
                }
            };
        }

        function renderFloatingMenu() {
            const allMatches = fixtures;
            if (!allMatches.length) {
                floatingMenuContent.innerHTML = '<div class="empty">No matches available</div>';
                return;
            }

            const dates = getSortedUniqueDates();
            let html = '';

            dates.forEach(date => {
                const dayMatches = allMatches.filter(match => match.date === date);
                if (!dayMatches.length) {
                    return;
                }

                const headingDate = new Date(`${date}T12:00:00`).toLocaleDateString('en-GB', {
                    weekday: 'long', day: 'numeric', month: 'long'
                });

                html += `<div class="floatingDayHeader">${getDayNumberLabel(date)} · ${headingDate}</div>`;
                html += dayMatches.map(match => {
                    const formattedDate = match.date ? new Date(match.date + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }) : '';
                    return `
                    <div class="floatingMatchItem clickable" data-group="${match.group || ''}" data-date="${match.date || ''}">
                        <div class="floatingMatchInfo">
                            <div class="floatingMatchTeams">${renderTeamShort(match.teams?.[0])} <span class="scorePill">${getMatchScoreText(match)}</span> ${renderTeamShort(match.teams?.[1])}</div>
                            <div class="floatingMatchMeta">${match.day} ${formattedDate} · ${match.timeUK}${match.group ? ` · Group ${match.group}` : ''} · ${match.round}</div>
                        </div>
                        <div class="floatingMatchBroadcast">${getBroadcasterIcon(match.broadcast)} ${match.broadcast || 'TBC'}</div>
                    </div>
                `;
                }).join('');
            });

            floatingMenuContent.innerHTML = html;

            floatingMenuContent.querySelectorAll('.floatingMatchItem.clickable').forEach(item => {
                item.onclick = () => {
                    const group = item.dataset.group;
                    const date = item.dataset.date;
                    if (group) {
                        selectedGroup = group;
                        selectedTeam = '';
                        if (date) {
                            selectedDate = date;
                            datePicker.value = selectedDate;
                        }
                        startGroupLiveRefresh();
                        floatingMenu.classList.remove('open');
                        render();
                    }
                };
            });
        }

        function renderTeamShort(team) {
            if (!team) return '';
            return `${FLAGS[team] || '🏳️'}<span style="margin-left: 4px;">${getShortName(team)}</span>`;
        }

        function getBroadcasterIcon(broadcast) {
            if (!broadcast) return '';
            const bc = broadcast.toUpperCase();
            if (bc.includes('BBC')) return '<img src="broadcasts/bbc.svg" alt="BBC" />';
            if (bc.includes('ITV')) return '<img src="broadcasts/itv.svg" alt="ITV" />';
            if (bc.includes('STV')) return '<img src="broadcasts/stv.svg" alt="STV" />';
            return '';
        }

        document.getElementById('prevDay').onclick = () => jumpToMatchDay(-1);
        document.getElementById('nextDay').onclick = () => jumpToMatchDay(1);
        document.getElementById('todayBtn').onclick = () => jumpToTodayOrNextMatchDay();
        datePicker.onchange = () => setDate(datePicker.value);

        // Remove any old service worker/cache from the previous version.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister()));
        }
        if ('caches' in window) {
            caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
        }

        fetch(`fixtures.json?cacheBust=${Date.now()}`, { cache: 'no-store' })
            .then(response => response.json())
            .then(data => {
                fixtures = data.sort((a, b) => `${a.date} ${a.timeUK}`.localeCompare(`${b.date} ${b.timeUK}`));
                jumpToTodayOrNextMatchDay();
            })
            .catch(error => {
                matches.innerHTML = '<div class="empty">Could not load fixtures.json. Make sure it is in the same folder as index.html.</div>';
                console.error(error);
            });
    </script>
</body>

</html>
