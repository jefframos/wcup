<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Cup 2026 UK TV Guide</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Barlow Condensed', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #003399;
            color: #fff;
            padding: 10px 12px 8px;
            border-bottom: 3px solid #FFD700;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 12px rgba(0, 31, 102, 0.35);
            text-align: center;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 24px;
            letter-spacing: -0.03em;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #fff;
        }

        h1 img {
            height: 40px;
            width: auto;
            display: block;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 20px;
                gap: 10px;
            }

            h1 img {
                height: 32px;
            }
        }

        .hint {
            margin: 0 0 8px;
            color: #dbeafe;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .filterToggleBtn {
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 0 10px;
            height: 32px;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
            background: #eff6ff;
            color: #0b2a6d;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .filterToggleBtn:hover {
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .filterPanel {
            display: block;
            margin-top: 6px;
        }

        header.filters-collapsed .filterPanel {
            display: none;
        }

        .topNav {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
            justify-content: center;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
            flex-wrap: nowrap;
        }

        .timeControls {
            display: flex;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }

        .dateNav {
            display: flex;
            gap: 6px;
            flex: 1;
        }

        .dateNav button,
        .today,
        .teamChip {
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 0 10px;
            font: inherit;
            font-weight: 700;
            font-size: 13px;
            background: #eff6ff;
            color: #0b2a6d;
            cursor: pointer;
            transition: all 0.2s;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .dateNav button:hover,
        .today:hover,
        .teamChip:hover {
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .dateNav button {
            flex: 1;
            min-width: 0;
        }

        .today {
            flex: 1;
            max-width: 92px;
            background: #FFD700;
            border-color: #FFD700;
            color: #003399;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
        }

        .today:hover {
            background: #FFC700;
        }

        .bottomDateLabel {
            margin: 2px 0 6px;
            color: #dbeafe;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-align: center;
        }

        .dateLine {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            min-height: 0;
        }

        .calendarCard {
            display: none;
            background: #fff;
            border: 1px solid #dbe3ef;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.15);
            max-width: 720px;
            margin: 0 auto 12px;
        }

        .calendarCard.open {
            display: block;
        }

        .calendarTop {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .calendarMonthLabel {
            font-size: 16px;
            font-weight: 700;
            color: #003399;
        }

        .calendarNavBtn {
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            background: #f8fafc;
            color: #0f172a;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        .calendarWeekdays,
        .calendarGrid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 6px;
        }

        .calendarWeekday {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
        }

        .calendarDayCell {
            min-height: 62px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
            padding: 4px;
            text-align: left;
            cursor: pointer;
        }

        .calendarDayCell:hover {
            border-color: #003399;
            box-shadow: 0 3px 10px rgba(0, 51, 153, 0.12);
        }

        .calendarDayCell.empty {
            background: #f8fafc;
            border-style: dashed;
            cursor: default;
        }

        .calendarDayCell.active {
            border-color: #003399;
            background: #eef4ff;
        }

        .calendarDayNum {
            font-size: 12px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 3px;
        }

        .calendarFlags {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }

        .calendarFlag {
            width: 14px;
            height: 10px;
            border-radius: 2px;
            object-fit: cover;
        }

        .calendarMore {
            font-size: 10px;
            color: #64748b;
            font-weight: 600;
        }

        .calendarUnknown {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            font-weight: 700;
            color: #003399;
            background: #eef4ff;
            border: 1px solid #cfe0ff;
            border-radius: 999px;
            padding: 1px 5px;
            margin-top: 2px;
        }

        input[type="date"] {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px 10px;
            background: #f8fafc;
            color: #0f172a;
            font: inherit;
            font-size: 13px;
        }

        input[type="date"]::placeholder {
            color: #94a3b8;
        }

        .chips {
            display: flex;
            flex-direction: row;
            gap: 8px;
            padding: 0;
            flex-wrap: wrap;
            margin: 0;
            justify-content: center;
        }

        .teamChip {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .teamChip.active {
            background: #FFD700;
            border-color: #FFD700;
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.35);
            color: #003399;
        }

        .flag {
            font-size: 22px;
            line-height: 1;
        }

        .flag-img {
            width: 22px;
            height: 16px;
            vertical-align: middle;
            margin-right: 2px;
        }

        main {
            padding: 12px;
            max-width: 780px;
            margin: 0 auto;
        }

        .summary {
            color: #64748b;
            font-size: 14px;
            margin: 0 0 10px;
        }

        .match {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px;
            margin: 12px 0;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
            transition: all 0.2s;
            cursor: pointer;
        }

        .match:hover {
            box-shadow: 0 8px 20px rgba(0, 51, 153, 0.12);
            transform: translateY(-2px);
            border-color: #003399;
        }

        .match.finished {
            border: 2px solid #16a34a;
            box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.12);
        }

        .matchTop {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
        }

        .fixture {
            font-size: 17px;
            font-weight: 900;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time {
            font-size: 20px;
            font-weight: 900;
            white-space: nowrap;
            color: #003399;
        }

        .meta {
            color: #64748b;
            font-size: 12px;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .scorePill {
            display: inline-block;
            margin: 0 6px;
            padding: 3px 10px;
            border-radius: 6px;
            background: #FFD700;
            color: #003399;
            font-size: 12px;
            font-weight: 800;
            vertical-align: middle;
        }

        .tv {
            margin-top: 12px;
            padding: 12px;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2f7 100%);
            border: 1px solid #cbd5e1;
            border-radius: 10px;
        }

        .tv.bc-bbc {
            background: linear-gradient(135deg, #ffd5ec 0%, #ff9fcb 100%);
            border-color: #f6a9cf;
        }

        .tv.bc-itv {
            background: linear-gradient(135deg, #d7f8ee 0%, #9ee7cf 100%);
            border-color: #9ddac7;
        }

        .tv.bc-tbc {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2f7 100%);
            border-color: #cbd5e1;
        }

        .tv strong {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .tv strong img {
            height: 18px;
            width: auto;
        }

        .stream {
            color: #64748b;
            font-size: 13px;
            margin-top: 3px;
        }

        .empty {
            text-align: center;
            color: #64748b;
            background: #fff;
            border: 1px dashed #cbd5e1;
            border-radius: 18px;
            padding: 28px 16px;
        }

        .calendarBtn {
            width: 32px;
            height: 32px;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            background: #eff6ff;
            color: #0b2a6d;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .calendarBtn:hover {
            background: #f1f5f9;
        }

        #datePicker {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        /* Floating All Matches button styling handled in header .allMatchesBtn */

        .floatingMenu {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.65);
            z-index: 40;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .floatingMenu.open {
            display: flex;
        }

        .floatingMenuPanel {
            width: min(1200px, 100%);
            height: min(88vh, 880px);
            background: #fff;
            border-radius: 16px;
            border: 1px solid #dbe3ef;
            box-shadow: 0 18px 46px rgba(2, 6, 23, 0.28);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .floatingMenuHeader {
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .floatingMenuHeader h2 {
            margin: 0;
            font-size: 20px;
            color: #0b2a6d;
        }

        .floatingMenuHeader button {
            background: #f1f5f9;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            font-size: 20px;
            cursor: pointer;
            color: #475569;
        }

        .floatingMenuContent {
            overflow-y: auto;
            flex: 1;
            padding: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .mosaicGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .mosaicLegend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            color: #334155;
        }

        .mosaicLegendChip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0;
            font-weight: 600;
            border: none;
            background: none;
            color: #334155;
        }

        .mosaicLegendChip.bc-bbc {
            color: #a21caf;
        }

        .mosaicLegendChip.bc-itv {
            color: #047857;
        }

        .mosaicLegendChip.bc-tbc {
            color: #475569;
        }

        .mosaicLegendChip::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid rgba(15, 23, 42, 0.15);
        }

        .mosaicLegendChip.bc-bbc::before {
            background: linear-gradient(135deg, #ffd5ec 0%, #ff9fcb 100%);
            border-color: #f6a9cf;
        }

        .mosaicLegendChip.bc-itv::before {
            background: linear-gradient(135deg, #d7f8ee 0%, #9ee7cf 100%);
            border-color: #9ddac7;
        }

        .mosaicLegendChip.bc-tbc::before {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2f7 100%);
            border-color: #cbd5e1;
        }

        .mosaicLegendChip:last-child::before {
            display: none;
        }

        .mosaicCard {
            border: 1px solid #dbe3ef;
            border-radius: 10px;
            background: #fff;
            padding: 8px;
            cursor: pointer;
            text-align: center;
        }

        .mosaicCard.bc-bbc {
            background: linear-gradient(135deg, #ffd5ec 0%, #ff9fcb 100%);
            border-color: #f6a9cf;
        }

        .mosaicCard.bc-itv {
            background: linear-gradient(135deg, #d7f8ee 0%, #9ee7cf 100%);
            border-color: #9ddac7;
        }

        .mosaicCard.bc-tbc {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2f7 100%);
            border-color: #cbd5e1;
        }

        .mosaicCard:hover {
            border-color: #003399;
            box-shadow: 0 8px 18px rgba(0, 51, 153, 0.14);
            transform: translateY(-2px);
        }

        .mosaicCard.finished {
            border: 2px solid #16a34a;
            box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.12);
        }

        .mosaicFlags {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 30px;
            margin-bottom: 6px;
        }

        .mosaicFlag img {
            width: 24px;
            height: 17px;
            border-radius: 2px;
            border: 1px solid #dbe3ef;
        }

        .mosaicVs {
            font-size: 14px;
            font-weight: 800;
            color: #0b2a6d;
            line-height: 1;
        }

        .mosaicMeta {
            font-size: 12px;
            color: #475569;
            line-height: 1.2;
        }

        .listMenu {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.65);
            z-index: 39;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .listMenu.open {
            display: flex;
        }

        .listMenuPanel {
            width: min(980px, 100%);
            height: min(88vh, 860px);
            background: #fff;
            border-radius: 16px;
            border: 1px solid #dbe3ef;
            box-shadow: 0 18px 46px rgba(2, 6, 23, 0.28);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .listMenuHeader {
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .listMenuHeader h2 {
            margin: 0;
            font-size: 20px;
            color: #0b2a6d;
        }

        .listMenuHeader button {
            background: #f1f5f9;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            font-size: 20px;
            cursor: pointer;
            color: #475569;
        }

        .listMenuContent {
            overflow-y: auto;
            flex: 1;
            padding: 0 12px 8px;
            -webkit-overflow-scrolling: touch;
        }

        .listDayHeader {
            position: sticky;
            top: 0;
            z-index: 1;
            padding: 8px 10px;
            margin: 0 0 6px;
            background: #003399;
            color: #fff;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .listMatchItem {
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .listMatchItem.bc-bbc {
            background: linear-gradient(135deg, #ffd5ec 0%, #ff9fcb 100%);
        }

        .listMatchItem.bc-itv {
            background: linear-gradient(135deg, #d7f8ee 0%, #9ee7cf 100%);
        }

        .listMatchItem.bc-tbc {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2f7 100%);
        }

        .listMatchItem:hover {
            background: #f8fafc;
        }

        .listMatchItem.finished {
            border-left: 4px solid #16a34a;
            box-shadow: inset 0 0 0 1px rgba(22, 163, 74, 0.2);
        }

        .listMatchInfo {
            flex: 1;
        }

        .listMatchTeams {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .listMatchMeta {
            font-size: 12px;
            color: #64748b;
        }

        .listMatchBroadcast {
            font-size: 12px;
            color: #0f172a;
            font-weight: 500;
            text-align: right;
            min-width: 80px;
        }

        main {
            padding-bottom: 80px;
        }

        .nextMatchWidget {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 35;
            min-width: 220px;
            max-width: 300px;
            background: #fff;
            border: 1px solid #dbe3ef;
            border-radius: 12px;
            box-shadow: 0 12px 26px rgba(2, 6, 23, 0.2);
            padding: 10px;
            cursor: pointer;
            display: none;
        }

        .nextMatchWidget.show {
            display: block;
        }

        .nextMatchTitle {
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }

        .nextMatchTeams {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 3px;
            flex-wrap: wrap;
        }

        .nextMatchMeta {
            font-size: 12px;
            color: #475569;
        }

        .nextMatchActions {
            margin-top: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .widgetActionBtn {
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            background: #f8fafc;
            color: #0b2a6d;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            height: 30px;
            cursor: pointer;
        }

        .widgetActionBtn:hover {
            background: #eef2f7;
            border-color: #c1ccda;
        }

        @media (max-width: 600px) {
            .nextMatchWidget {
                left: 10px;
                right: 10px;
                max-width: none;
                min-width: 0;
                align-items: center;
                gap: 8px;
                padding: 8px 10px;
            }

            .nextMatchWidget.show {
                display: flex;
            }

            .nextMatchTitle,
            .nextMatchMeta {
                display: none;
            }

            .nextMatchTeams {
                margin: 0;
                flex: 1;
                min-width: 0;
                flex-wrap: nowrap;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                font-size: 13px;
            }

            .nextMatchActions {
                margin-top: 0;
                display: flex;
                gap: 6px;
                flex: none;
            }

            .widgetActionBtn {
                height: 28px;
                padding: 0 8px;
                font-size: 11px;
                white-space: nowrap;
            }
        }

        .standings {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 16px;
            margin: 10px 0;
            box-shadow: 0 8px 18px rgba(15, 23, 42, .05);
        }

        .standings h3 {
            margin: 0 0 12px;
            font-size: 16px;
        }

        .standings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .standings-table thead {
            background: #f1f5f9;
        }

        .standings-table th {
            padding: 8px 6px;
            text-align: left;
            font-weight: 600;
            color: #0f172a;
            border-bottom: 1px solid #e2e8f0;
        }

        .standings-table td {
            padding: 8px 6px;
            border-bottom: 1px solid #f1f5f9;
        }

        .standings-table tr:last-child td {
            border-bottom: none;
        }

        .standings-team {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .standings-team img {
            width: 16px;
            height: 12px;
        }

        .standings-pos {
            font-weight: 600;
            color: #64748b;
            width: 24px;
        }

        .standings-pts {
            font-weight: 600;
            color: #0f172a;
            width: 30px;
        }

        .standings-stat {
            text-align: center;

<body>
    <header>

    <script>
        // Edit this list to the countries you follow.
        const FOLLOWED_TEAMS = ['England', 'Scotland', 'Brazil', 'Argentina', 'France', 'Spain', 'Portugal', 'Germany'];

        const FLAGS = {
            'Algeria': '<img src="flags/algeria.svg" alt="Algeria" class="flag-img"/>',

            'Saudi Arabia': '<img src="flags/saudiarabia.svg" alt="Saudi Arabia" class="flag-img"/>',
            'Scotland': '<img src="flags/scotland.svg" alt="Scotland" class="flag-img"/>',
            'Senegal': '<img src="flags/senegal.svg" alt="Senegal" class="flag-img"/>',
            'South Africa': '<img src="flags/southafrica.svg" alt="South Africa" class="flag-img"/>',
            'South Korea': '<img src="flags/southkorea.svg" alt="South Korea" class="flag-img"/>',
            'Spain': '<img src="flags/spain.svg" alt="Spain" class="flag-img"/>',
            'Sweden': '<img src="flags/sweden.svg" alt="Sweden" class="flag-img"/>',
            'Switzerland': '<img src="flags/switzerland.svg" alt="Switzerland" class="flag-img"/>',
            'Tunisia': '<img src="flags/tunisia.svg" alt="Tunisia" class="flag-img"/>',
            'Turkey': '<img src="flags/turkey.svg" alt="Turkey" class="flag-img"/>',
            'USA': '<img src="flags/usa.svg" alt="USA" class="flag-img"/>',
            'Uruguay': '<img src="flags/uruguay.svg" alt="Uruguay" class="flag-img"/>',
            'Uzbekistan': '<img src="flags/uzbekistan.svg" alt="Uzbekistan" class="flag-img"/>'
        };


        let fixtures = [];
        let selectedDate = isoToday();
        let selectedTeam = '';
        let selectedGroup = '';
        let liveRefreshTimer = null;
        let previousSelectedDate = '';
        let previousSelectedTeam = '';
        let previousSelectedGroup = '';

        const datePicker = document.getElementById('datePicker');
        const calendarBtn = document.getElementById('calendarBtn');
        const calendarCard = document.getElementById('calendarCard');
        const calendarMonthLabel = document.getElementById('calendarMonthLabel');
        const calendarWeekdays = document.getElementById('calendarWeekdays');
        const calendarGrid = document.getElementById('calendarGrid');
        const calendarPrevMonth = document.getElementById('calendarPrevMonth');
        const calendarNextMonth = document.getElementById('calendarNextMonth');
        const filterToggleBtn = document.getElementById('filterToggleBtn');
        const pageHeader = document.querySelector('header');
        const dateLabel = document.getElementById('dateLabel');
        const teamChips = document.getElementById('teamChips');
        const matches = document.getElementById('matches');
        const summary = document.getElementById('summary');
        const backBtn = document.getElementById('backBtn');
        const nextMatchWidget = document.getElementById('nextMatchWidget');
        const nextMatchTeams = document.getElementById('nextMatchTeams');
        const nextMatchMeta = document.getElementById('nextMatchMeta');
        let filtersCollapsed = true;
        let calendarMonthCursor = new Date();

        const FILTERS_COOKIE_NAME = 'wcup_filters_v1';

        function setCookie(name, value, days) {
            const expires = new Date(Date.now() + days * 864e5).toUTCString();
            document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
        }

        function getCookie(name) {
            const prefix = `${name}=`;
            const parts = document.cookie.split(';');
            for (const part of parts) {
                const trimmed = part.trim();
                if (trimmed.startsWith(prefix)) {
                    return decodeURIComponent(trimmed.slice(prefix.length));
                }
            }
            return '';
        }

        function saveFiltersToCookie() {
            const payload = {
                selectedDate,
                selectedTeam,
                selectedGroup,
                filtersCollapsed
            };
            setCookie(FILTERS_COOKIE_NAME, JSON.stringify(payload), 30);
        }

        function loadFiltersFromCookie() {
            const raw = getCookie(FILTERS_COOKIE_NAME);
            if (!raw) return;
            try {
                const saved = JSON.parse(raw);
                if (saved && typeof saved.selectedDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(saved.selectedDate)) {
                    selectedDate = saved.selectedDate;
                }
                if (saved && typeof saved.selectedTeam === 'string') {
                    selectedTeam = saved.selectedTeam;
                }
                if (saved && typeof saved.selectedGroup === 'string') {
                    selectedGroup = saved.selectedGroup;
                }
                if (saved && typeof saved.filtersCollapsed === 'boolean') {
                    filtersCollapsed = saved.filtersCollapsed;
                }
            } catch {
                // Ignore invalid cookie payload.
            }
        }

        loadFiltersFromCookie();

        function updateFilterToggleLabel() {
            if (!filterToggleBtn) return;
            filterToggleBtn.textContent = filtersCollapsed ? 'Show Filters' : 'Hide Filters';
            filterToggleBtn.setAttribute('aria-expanded', String(!filtersCollapsed));
        }

        function setFiltersCollapsed(collapsed) {
            filtersCollapsed = !!collapsed;
            if (pageHeader) {
                pageHeader.classList.toggle('filters-collapsed', filtersCollapsed);
            }
            if (filtersCollapsed) {
                closeCalendarCard();
            }
            updateFilterToggleLabel();
            saveFiltersToCookie();
        }

        function isoToday() {
            const d = new Date();
            return toIsoDate(d);
        }

        function toIsoDate(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function addDays(isoDate, days) {
            const d = new Date(`${isoDate}T12:00:00`);
            d.setDate(d.getDate() + days);
            return toIsoDate(d);
        }

        function getMatchDatesForCurrentFilter() {
            const dates = fixtures
                .filter(match => !selectedTeam || (match.teams || []).includes(selectedTeam))
                .map(match => match.date);
            return [...new Set(dates)].sort();
        }

        function jumpToMatchDay(direction) {
            const matchDates = getMatchDatesForCurrentFilter();
            if (!matchDates.length) return;

            let target;
            if (direction > 0) {
                target = matchDates.find(date => date > selectedDate) || matchDates[0];
            } else {
                target = [...matchDates].reverse().find(date => date < selectedDate) || matchDates[matchDates.length - 1];
            }
            setDate(target);
        }

        function jumpToTodayOrNextMatchDay() {
            const today = isoToday();
            const matchDates = getMatchDatesForCurrentFilter();
            const target = matchDates.find(date => date >= today) || matchDates[matchDates.length - 1] || today;
            setDate(target);
        }

        function prettyDate(isoDate) {
            return new Date(`${isoDate}T12:00:00`).toLocaleDateString('en-GB', {
                weekday: 'long', day: 'numeric', month: 'long'
            });
        }

        function shortWeekday(match) {
            if (typeof match.day === 'string' && match.day.length >= 3) {
                return match.day.slice(0, 3);
            }
            if (match.date) {
                return new Date(`${match.date}T12:00:00`).toLocaleDateString('en-GB', { weekday: 'short' });
            }
            return '';
        }

        function getSortedUniqueDates() {
            return [...new Set(fixtures.map(match => match.date))].sort();
        }

        function getDayNumberLabel(isoDate) {
            const dates = getSortedUniqueDates();
            const idx = dates.indexOf(isoDate);
            return idx >= 0 ? `DAY ${idx + 1}` : 'DAY ?';
        }

        function setDate(isoDate) {
            selectedDate = isoDate;
            datePicker.value = selectedDate;
            saveFiltersToCookie();
            render();
        }

        function getDayTeams(isoDate) {
            const teams = new Set();
            fixtures.filter(match => match.date === isoDate).forEach(match => {
                (match.teams || []).forEach(team => teams.add(team));
            });
            return Array.from(teams);
        }

        function getDayCalendarData(isoDate) {
            const dayMatches = fixtures.filter(match => match.date === isoDate);
            const knownTeams = new Set();
            let unknownMatches = 0;

            dayMatches.forEach(match => {
                const teams = match.teams || [];
                const hasUnknown = teams.some(team => !FLAGS[team]);
                if (hasUnknown) {
                    unknownMatches++;
                }
                teams.forEach(team => {
                    if (FLAGS[team]) {
                        knownTeams.add(team);
                    }
                });
            });

            return {
                knownTeams: Array.from(knownTeams),
                unknownMatches
            };
        }

        function getFlagImageSrc(flagHtml) {
            if (!flagHtml) return '';
            const m = flagHtml.match(/src="([^"]+)"/);
            return m ? m[1] : '';
        }

        function renderCalendarCard() {
            const year = calendarMonthCursor.getFullYear();
            const month = calendarMonthCursor.getMonth();
            const firstOfMonth = new Date(year, month, 1);
            const firstWeekday = (firstOfMonth.getDay() + 6) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            calendarMonthLabel.textContent = firstOfMonth.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

            const weekdayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            calendarWeekdays.innerHTML = weekdayNames.map(day => `<div class="calendarWeekday">${day}</div>`).join('');

            const cells = [];
            for (let i = 0; i < firstWeekday; i++) {
                cells.push('<div class="calendarDayCell empty" aria-hidden="true"></div>');
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const isoDate = toIsoDate(new Date(year, month, d));
                const dayData = getDayCalendarData(isoDate);
                const teams = dayData.knownTeams;
                const isActive = isoDate === selectedDate;
                const flagIcons = teams.map(team => {
                    const src = getFlagImageSrc(FLAGS[team]);
                    if (!src) return '';
                    return `<img class="calendarFlag" src="${src}" alt="${team}" title="${team}"/>`;
                }).join('');
                const unknownBadge = dayData.unknownMatches > 0
                    ? `<div class="calendarUnknown" title="${dayData.unknownMatches} match(es) with teams to be confirmed">🏆 TBD ${dayData.unknownMatches}</div>`
                    : '';
                cells.push(`
                    <button class="calendarDayCell${isActive ? ' active' : ''}" data-date="${isoDate}" type="button">
                        <div class="calendarDayNum">${d}</div>
                        <div class="calendarFlags">${flagIcons}</div>
                        ${unknownBadge}
                    </button>
                `);
            }

            calendarGrid.innerHTML = cells.join('');

            calendarGrid.querySelectorAll('.calendarDayCell[data-date]').forEach(cell => {
                cell.onclick = () => {
                    const isoDate = cell.dataset.date;
                    if (!isoDate) return;
                    selectedTeam = '';
                    selectedGroup = '';
                    stopGroupLiveRefresh();
                    setDate(isoDate);
                    closeCalendarCard();
                };
            });
        }

        function openCalendarCard() {
            const selected = new Date(`${selectedDate}T12:00:00`);
            calendarMonthCursor = new Date(selected.getFullYear(), selected.getMonth(), 1);
            renderCalendarCard();
            calendarCard.classList.add('open');
            calendarCard.setAttribute('aria-hidden', 'false');
        }

        function closeCalendarCard() {
            calendarCard.classList.remove('open');
            calendarCard.setAttribute('aria-hidden', 'true');
        }

        function toggleCalendarCard() {
            if (calendarCard.classList.contains('open')) {
                closeCalendarCard();
            } else {
                openCalendarCard();
            }
        }

        function renderChips() {
            teamChips.innerHTML = '';

            // Get all unique groups
            const groups = [...new Set(fixtures.filter(m => m.group).map(m => m.group))].sort();

            // Render group tabs
            const groupsSection = document.createElement('div');
            groupsSection.style.marginBottom = '4px';
            groupsSection.style.display = 'flex';
            groupsSection.style.gap = '6px';
            groupsSection.style.overflowX = 'auto';
            groupsSection.style.paddingBottom = '2px';
            groupsSection.style.WebkitOverflowScrolling = 'touch';

            const groupAllBtn = document.createElement('button');
            groupAllBtn.className = 'teamChip' + (selectedGroup === '' ? ' active' : '');
            groupAllBtn.innerHTML = 'Groups';
            groupAllBtn.onclick = () => {
                selectedGroup = '';
                selectedTeam = '';
                saveFiltersToCookie();
                render();
            };
            groupsSection.appendChild(groupAllBtn);

            groups.forEach(group => {
                const btn = document.createElement('button');
                btn.className = 'teamChip' + (selectedGroup === group ? ' active' : '');
                btn.textContent = `Group ${group}`;
                btn.onclick = () => {
                    selectedGroup = group;
                    selectedTeam = '';
                    startGroupLiveRefresh();
                    saveFiltersToCookie();
                    render();
                };
                groupsSection.appendChild(btn);
            });

            teamChips.appendChild(groupsSection);

            // Render team chips
            const teamSection = document.createElement('div');
            teamSection.style.display = 'flex';
            teamSection.style.gap = '8px';
            teamSection.style.overflowX = 'auto';
            teamSection.style.paddingBottom = '2px';
            teamSection.style.WebkitOverflowScrolling = 'touch';

            const allTeamBtn = document.createElement('button');
            allTeamBtn.className = 'teamChip' + (selectedTeam === '' && selectedGroup === '' ? ' active' : '');
            allTeamBtn.innerHTML = '🌍<span>All</span>';
            allTeamBtn.onclick = () => {
                selectedTeam = '';
                selectedGroup = '';
                stopGroupLiveRefresh();
                saveFiltersToCookie();
                render();
            };
            teamSection.appendChild(allTeamBtn);

            FOLLOWED_TEAMS.forEach(team => {
                teamSection.appendChild(makeChip(team, FLAGS[team] || '🏳️', team));
            });

            teamChips.appendChild(teamSection);
        }

        function makeChip(team, flag, label) {
            const button = document.createElement('button');
            button.className = 'teamChip' + (team === selectedTeam ? ' active' : '');
            button.dataset.team = team;
            button.innerHTML = `<span class="flag">${flag}</span><span>${getShortName(label)}</span>`;
            button.onclick = () => {
                selectedTeam = team;
                selectedGroup = '';
                stopGroupLiveRefresh();
                saveFiltersToCookie();
                render();
            };
            return button;
        }

        function getShortName(name) {
            const SHORTS = {
                'Algeria': 'ALG', 'Argentina': 'ARG', 'Australia': 'AUS', 'Austria': 'AUT', 'Belgium': 'BEL',
                'Bosnia-Herzegovina': 'BIH', 'Brazil': 'BRA', 'Canada': 'CAN', 'Cape Verde': 'CPV', 'Colombia': 'COL',
                'Croatia': 'CRO', 'Curacao': 'CUW', 'Czech Republic': 'CZE', 'DR Congo': 'COD', 'Ecuador': 'ECU',
                'Egypt': 'EGY', 'England': 'ENG', 'France': 'FRA', 'Germany': 'GER', 'Ghana': 'GHA',
                'Haiti': 'HTI', 'Iran': 'IRN', 'Iraq': 'IRQ', 'Ivory Coast': 'CIV', 'Japan': 'JPN',
                'Jordan': 'JOR', 'Mexico': 'MEX', 'Morocco': 'MAR', 'Netherlands': 'NED', 'New Zealand': 'NZL',
                'Norway': 'NOR', 'Panama': 'PAN', 'Paraguay': 'PAR', 'Portugal': 'POR', 'Qatar': 'QAT',
                'Saudi Arabia': 'KSA', 'Scotland': 'SCO', 'Senegal': 'SEN', 'South Africa': 'RSA', 'South Korea': 'KOR',
                'Spain': 'ESP', 'Sweden': 'SWE', 'Switzerland': 'SUI', 'Tunisia': 'TUN', 'Turkey': 'TUR',
                'USA': 'USA', 'Uruguay': 'URU', 'Uzbekistan': 'UZB'
            };
            return SHORTS[name] || name;
        }

        function getGroupTeams(group) {
            const teams = new Set();
            fixtures.filter(m => m.group === group).forEach(m => {
                if (m.teams) m.teams.forEach(t => teams.add(t));
            });
            return Array.from(teams);
        }

        function getVisibleMatches() {
            return fixtures.filter(match => {
                if (selectedGroup) {
                    // When a group is selected, show all matches for that group
                    return match.group === selectedGroup;
                } else if (selectedTeam) {
                    // When a team is selected, show all matches for that team
                    return (match.teams || []).includes(selectedTeam);
                } else {
                    // When "All" is selected, show matches for the selected date
                    return match.date === selectedDate;
                }
            });
        }

        function render() {
            // Show or hide back button based on whether there's a previous state
            const hasPreviousState = previousSelectedDate || previousSelectedTeam || previousSelectedGroup;
            if (hasPreviousState) {
                backBtn.classList.add('visible');
            } else {
                backBtn.classList.remove('visible');
            }

            dateLabel.textContent = `${selectedDate === isoToday() ? 'Today · ' : ''}${prettyDate(selectedDate)}`;
            summary.innerHTML = '';
            renderChips();
            renderNextMatchWidget();

            const rows = getVisibleMatches();

            let summaryText = '';
            if (selectedGroup) {
                const groupTeams = getGroupTeams(selectedGroup);
                summaryText = `Group ${selectedGroup} · ${groupTeams.length} teams · live refresh every 60s`;
            } else if (selectedTeam) {
                summaryText = `${rows.length} match${rows.length === 1 ? '' : 'es'} · ${FLAGS[selectedTeam] || ''} ${selectedTeam}`;
            } else {
                summaryText = `${rows.length} match${rows.length === 1 ? '' : 'es'} on ${prettyDate(selectedDate)}`;
            }

            summary.innerHTML = summaryText;

            if (!rows.length) {
                matches.innerHTML = '<div class="empty">No matches for this day/filter. Use Next match day or choose All.</div>';
                return;
            }

            // Build standings + matches if group is selected
            let htmlContent = '';
            if (selectedGroup) {
                const standings = buildGroupStandingsHTML(selectedGroup);
                htmlContent = standings;
            }

            htmlContent += rows.map(match => `
        <article class="match ${isMatchFinished(match) ? 'finished' : ''}" data-group="${match.group}" data-matchno="${match.matchNo || ''}" style="cursor: pointer;">
          <div class="matchTop">
            <div>
              <div class="fixture">
                                ${renderTeam(match.teams?.[0])} <span class="scorePill">${getMatchScoreText(match)}</span> ${renderTeam(match.teams?.[1])}
              </div>
                            <div class="meta">${getDayNumberLabel(match.date)} · ${shortWeekday(match)} ${match.date ? new Date(match.date + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }) : ''} · ${match.round}${match.group ? ` · Group ${match.group}` : ''}</div>
            </div>
            <div class="time">${match.timeUK}</div>
          </div>
                    <div class="tv ${getBroadcasterClass(match.broadcast)}">
            <strong>${getBroadcasterIcon(match.broadcast)} ${match.broadcast || 'TBC'}</strong>
            ${match.streaming ? `<div class="stream">${match.streaming}</div>` : ''}
          </div>
        </article>
      `).join('');

            matches.innerHTML = htmlContent;

            // Make match cards clickable to navigate to group
            document.querySelectorAll('.match').forEach(card => {
                card.addEventListener('click', () => {
                    const group = card.dataset.group;
                    if (group) {
                        // Save current state before changing
                        previousSelectedDate = selectedDate;
                        previousSelectedTeam = selectedTeam;
                        previousSelectedGroup = selectedGroup;

                        selectedGroup = group;
                        selectedTeam = '';
                        saveFiltersToCookie();
                        render();
                    }
                });
            });

            function renderTeam(team) {
                if (!team) return '';
                return `<span class='flag'>${FLAGS[team] || '🏳️'}</span><span>${getShortName(team)}</span>`;
            }
        }

        function buildGroupStandingsHTML(group) {
            const teamIds = getGroupTeams(group);
            const groupMatches = fixtures.filter(m => m.group === group);

            // Initialize standings data
            const standings = {};
            teamIds.forEach(team => {
                standings[team] = { P: 0, W: 0, D: 0, L: 0, GF: 0, GA: 0, GD: 0, Pts: 0 };
            });

            // Calculate standings from matches
            groupMatches.forEach(match => {
                const teams = match.teams;
                if (teams && teams.length === 2) {
                    const [team1, team2] = teams;
                    const score = getNumericScore(match);
                    if (!score) {
                        return;
                    }

                    standings[team1].P++;
                    standings[team2].P++;
                    standings[team1].GF += score.home;
                    standings[team1].GA += score.away;
                    standings[team2].GF += score.away;
                    standings[team2].GA += score.home;

                    if (score.home > score.away) {
                        standings[team1].W++;
                        standings[team1].Pts += 3;
                        standings[team2].L++;
                    } else if (score.home < score.away) {
                        standings[team2].W++;
                        standings[team2].Pts += 3;
                        standings[team1].L++;
                    } else {
                        standings[team1].D++;
                        standings[team2].D++;
                        standings[team1].Pts += 1;
                        standings[team2].Pts += 1;
                    }

                    standings[team1].GD = standings[team1].GF - standings[team1].GA;
                    standings[team2].GD = standings[team2].GF - standings[team2].GA;
                }
            });

            // Sort by points (desc), then by goal difference (desc), then by goals for (desc)
            const sorted = Object.entries(standings).sort((a, b) => {
                if (b[1].Pts !== a[1].Pts) return b[1].Pts - a[1].Pts;
                if (b[1].GD !== a[1].GD) return b[1].GD - a[1].GD;
                return b[1].GF - a[1].GF;
            });

            const tableHTML = `
                <div class="standings">
                    <h3>Group ${group} Standings</h3>
                    <table class="standings-table">
                        <thead>
                            <tr>
                                <th style="width: 30px;">Pos</th>
                                <th>Team</th>
                                <th class="standings-stat">P</th>
                                <th class="standings-stat">W</th>
                                <th class="standings-stat">D</th>
                                <th class="standings-stat">L</th>
                                <th class="standings-stat">GF</th>
                                <th class="standings-stat">GA</th>
                                <th class="standings-stat">GD</th>
                                <th class="standings-pts">Pts</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sorted.map((entry, idx) => {
                const team = entry[0];
                const stats = entry[1];
                return `
                                    <tr>
                                        <td class="standings-pos">${idx + 1}</td>
                                        <td>
                                            <div class="standings-team">
                                                ${FLAGS[team] || '🏳️'}
                                                <span>${getShortName(team)}</span>
                                            </div>
                                        </td>
                                        <td class="standings-stat">${stats.P}</td>
                                        <td class="standings-stat">${stats.W}</td>
                                        <td class="standings-stat">${stats.D}</td>
                                        <td class="standings-stat">${stats.L}</td>
                                        <td class="standings-stat">${stats.GF}</td>
                                        <td class="standings-stat">${stats.GA}</td>
                                        <td class="standings-stat">${stats.GD > 0 ? '+' : ''}${stats.GD}</td>
                                        <td class="standings-pts">${stats.Pts}</td>
                                    </tr>
                                `;
            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            return tableHTML;
        }

        function getNumericScore(match) {
            if (typeof match.homeScore === 'number' && typeof match.awayScore === 'number') {
                return { home: match.homeScore, away: match.awayScore };
            }

            if (match.score && typeof match.score.home === 'number' && typeof match.score.away === 'number') {
                return { home: match.score.home, away: match.score.away };
            }

            if (typeof match.result === 'string') {
                const m = match.result.match(/(\d+)\s*[-:]\s*(\d+)/);
                if (m) {
                    return { home: Number(m[1]), away: Number(m[2]) };
                }
            }

            return null;
        }

        function getMatchScoreText(match) {
            const score = getNumericScore(match);
            if (!score) {
                return 'vs';
            }
            return `${score.home}-${score.away}`;
        }

        function isMatchFinished(match) {
            return !!getNumericScore(match);
        }

        function getMatchDateTime(match) {
            if (!match || !match.date) return new Date(0);
            const time = typeof match.timeUK === 'string' && /^\d{1,2}:\d{2}$/.test(match.timeUK)
                ? match.timeUK
                : '12:00';
            return new Date(`${match.date}T${time}:00`);
        }

        function getNextUpcomingMatch() {
            const now = new Date();
            return fixtures
                .slice()
                .sort((a, b) => getMatchDateTime(a) - getMatchDateTime(b))
                .find(match => getMatchDateTime(match) >= now) || null;
        }

        function goToMatch(match) {
            if (!match) return;

            if (match.date) {
                selectedDate = match.date;
                datePicker.value = selectedDate;
            }

            selectedTeam = '';
            if (match.group) {
                selectedGroup = match.group;
                startGroupLiveRefresh();
            } else {
                selectedGroup = '';
                stopGroupLiveRefresh();
            }

            render();

            setTimeout(() => {
                const selector = `.match[data-matchno="${match.matchNo || ''}"]`;
                const target = document.querySelector(selector);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 80);
        }

        function renderNextMatchWidget() {
            const next = getNextUpcomingMatch();
            if (!next) {
                nextMatchWidget.classList.remove('show');
                return;
            }

            const left = next.teams?.[0] || 'TBD';
            const right = next.teams?.[1] || 'TBD';
            nextMatchTeams.innerHTML = `${renderTeamShort(left)} <span class="scorePill">v</span> ${renderTeamShort(right)}`;
            const dateText = next.date
                ? new Date(next.date + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })
                : '';
            nextMatchMeta.textContent = `${dateText} · ${next.timeUK || ''}${next.group ? ` · Group ${next.group}` : ''}`;
            nextMatchWidget.onclick = () => goToMatch(next);
            nextMatchWidget.classList.add('show');
        }

        function stopGroupLiveRefresh() {
            if (liveRefreshTimer) {
                clearInterval(liveRefreshTimer);
                liveRefreshTimer = null;
            }
        }

        function startGroupLiveRefresh() {
            stopGroupLiveRefresh();
            refreshFixturesNow();
            liveRefreshTimer = setInterval(() => {
                if (selectedGroup) {
                    refreshFixturesNow();
                }
            }, 60000);
        }

        function refreshFixturesNow() {
            fetch(`fixtures.json?cacheBust=${Date.now()}`, { cache: 'no-store' })
                .then(response => response.json())
                .then(data => {
                    fixtures = data.sort((a, b) => `${a.date} ${a.timeUK}`.localeCompare(`${b.date} ${b.timeUK}`));
                    render();
                })
                .catch(() => {
                    // Keep current data if refresh fails.
                });
        }

        function refreshFixturesSilent() {
            return fetch(`fixtures.json?cacheBust=${Date.now()}`, { cache: 'no-store' })
                .then(response => response.json())
                .then(data => {
                    fixtures = data.sort((a, b) => `${a.date} ${a.timeUK}`.localeCompare(`${b.date} ${b.timeUK}`));
                })
                .catch(() => {
                    // Keep current data if refresh fails.
                });
        }

        function ensureFloatingMenuElements() {
            let menu = document.getElementById('floatingMenu');
            if (!menu) {
                menu = document.createElement('div');
                menu.id = 'floatingMenu';
                menu.className = 'floatingMenu';
                menu.innerHTML = `
                    <div class="floatingMenuPanel">
                        <div class="floatingMenuHeader">
                            <h2>All Matches Mosaic</h2>
                            <button id="closeMenuBtn">✕</button>
                        </div>
                        <div class="floatingMenuContent" id="floatingMenuContent"></div>
                    </div>
                `;
                document.body.appendChild(menu);
            }
            return menu;
        }

        const floatingMenu = ensureFloatingMenuElements();
        const floatingMenuContent = document.getElementById('floatingMenuContent');
        const allMatchesBtn = document.getElementById('allMatchesBtn');
        const mosaicBtn = document.getElementById('mosaicBtn');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const listMenu = document.getElementById('listMenu');
        const listMenuContent = document.getElementById('listMenuContent');
        const closeListMenuBtn = document.getElementById('closeListMenuBtn');
        const nextMatchBtn = document.getElementById('nextMatchBtn');

        if (allMatchesBtn) {
            allMatchesBtn.onclick = (event) => {
                event.stopPropagation();
                listMenu.classList.add('open');
                renderAllMatchesList();
            };
        }

        if (mosaicBtn) {
            mosaicBtn.onclick = (event) => {
                event.stopPropagation();
                floatingMenu.classList.add('open');
                renderFloatingMenu();
                refreshFixturesSilent().then(() => {
                    renderFloatingMenu();
                });
            };
        }

        if (closeMenuBtn) {
            closeMenuBtn.onclick = () => {
                floatingMenu.classList.remove('open');
            };
        }

        floatingMenu.addEventListener('click', (event) => {
            if (event.target === floatingMenu) {
                floatingMenu.classList.remove('open');
            }
        });

        if (closeListMenuBtn) {
            closeListMenuBtn.onclick = () => {
                listMenu.classList.remove('open');
            };
        }

        listMenu.addEventListener('click', (event) => {
            if (event.target === listMenu) {
                listMenu.classList.remove('open');
            }
        });

        backBtn.addEventListener('click', () => {
            selectedDate = previousSelectedDate;
            selectedTeam = previousSelectedTeam;
            selectedGroup = previousSelectedGroup;
            previousSelectedDate = '';
            previousSelectedTeam = '';
            previousSelectedGroup = '';
            saveFiltersToCookie();
            render();
        });

        if (nextMatchBtn) {
            nextMatchBtn.onclick = () => {
                const nextMatch = fixtures.find(match => `${match.date} ${match.timeUK}` >= `${selectedDate} ${new Date().toTimeString().slice(0, 5)}` || match.date > selectedDate);
                if (nextMatch) {
                    setDate(nextMatch.date);
                    setTimeout(() => {
                        const matchElements = document.querySelectorAll('.match');
                        if (matchElements.length > 0) {
                            matchElements[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 100);
                }
            };
        }

        function renderAllMatchesList() {
            if (!fixtures.length) {
                listMenuContent.innerHTML = '<div class="empty">No matches available</div>';
                return;
            }

            const dates = getSortedUniqueDates();
            let html = '';

            dates.forEach(date => {
                const dayMatches = fixtures.filter(match => match.date === date);
                if (!dayMatches.length) return;

                const headingDate = new Date(`${date}T12:00:00`).toLocaleDateString('en-GB', {
                    weekday: 'long', day: 'numeric', month: 'long'
                });

                html += `<div class="listDayHeader">${getDayNumberLabel(date)} · ${headingDate}</div>`;
                html += dayMatches.map(match => {
                    const formattedDate = match.date ? new Date(match.date + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }) : '';
                    return `
                    <div class="listMatchItem ${getBroadcasterClass(match.broadcast)} ${isMatchFinished(match) ? 'finished' : ''}" data-matchno="${match.matchNo || ''}" data-group="${match.group || ''}" data-date="${match.date || ''}">
                        <div class="listMatchInfo">
                            <div class="listMatchTeams">${renderTeamShort(match.teams?.[0])} <span class="scorePill">${getMatchScoreText(match)}</span> ${renderTeamShort(match.teams?.[1])}</div>
                            <div class="listMatchMeta">${shortWeekday(match)} ${formattedDate} · ${match.timeUK}${match.group ? ` · Group ${match.group}` : ''} · ${match.round}</div>
                        </div>
                        <div class="listMatchBroadcast">${getBroadcasterIcon(match.broadcast)} ${match.broadcast || 'TBC'}</div>
                    </div>
                `;
                }).join('');
            });

            listMenuContent.innerHTML = html;

            listMenuContent.querySelectorAll('.listMatchItem').forEach(item => {
                item.onclick = () => {
                    const date = item.dataset.date || '';
                    const matchNo = item.dataset.matchno || '';
                    listMenu.classList.remove('open');
                    const match = fixtures.find(m => String(m.matchNo || '') === String(matchNo || '') && (!date || m.date === date));
                    goToMatch(match);
                };
            });
        }

        function renderFloatingMenu() {
            const allMatches = fixtures;
            if (!allMatches.length) {
                floatingMenuContent.innerHTML = '<div class="empty">No matches available</div>';
                return;
            }

            const sortedMatches = [...allMatches].sort((a, b) => `${a.date} ${a.timeUK}`.localeCompare(`${b.date} ${b.timeUK}`));
            const tiles = sortedMatches.map(match => {
                const teamA = match.teams?.[0] || 'TBD';
                const teamB = match.teams?.[1] || 'TBD';
                const flagA = FLAGS[teamA] || '<span class="mosaicVs">TBD</span>';
                const flagB = FLAGS[teamB] || '<span class="mosaicVs">TBD</span>';
                const centerLabel = getMatchScoreText(match) === 'vs' ? 'v' : getMatchScoreText(match);
                const when = `${shortWeekday(match)} ${match.date ? new Date(match.date + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : ''}`.trim();
                const bcClass = getBroadcasterClass(match.broadcast);
                return `
                    <button class="mosaicCard ${bcClass} ${isMatchFinished(match) ? 'finished' : ''}" data-matchno="${match.matchNo || ''}" data-date="${match.date || ''}" data-group="${match.group || ''}" type="button">
                        <div class="mosaicFlags">
                            <span class="mosaicFlag">${flagA}</span>
                            <span class="mosaicVs">${centerLabel}</span>
                            <span class="mosaicFlag">${flagB}</span>
                        </div>
                        <div class="mosaicMeta">${when} · ${match.timeUK || ''}</div>
                    </button>
                `;
            }).join('');

            floatingMenuContent.innerHTML = `
                <div class="mosaicLegend">
                    <span class="mosaicLegendChip bc-bbc">BBC iPlayer</span>
                    <span class="mosaicLegendChip bc-itv">ITV/STV</span>
                    <span class="mosaicLegendChip bc-tbc">TBC</span>
                    <span class="mosaicLegendChip">Score shown when finished</span>
                </div>
                <div class="mosaicGrid">${tiles}</div>
            `;

            floatingMenuContent.querySelectorAll('.mosaicCard').forEach(item => {
                item.onclick = () => {
                    const date = item.dataset.date || '';
                    const matchNo = item.dataset.matchno || '';
                    floatingMenu.classList.remove('open');
                    const match = fixtures.find(m => String(m.matchNo || '') === String(matchNo || '') && (!date || m.date === date));
                    goToMatch(match);
                };
            });
        }

        function renderTeamShort(team) {
            if (!team) return '';
            return `${FLAGS[team] || '🏳️'}<span style="margin-left: 4px;">${getShortName(team)}</span>`;
        }

        function getBroadcasterIcon(broadcast) {
            if (!broadcast) return '';
            const bc = broadcast.toUpperCase();
            if (bc.includes('BBC')) return '<img src="broadcasts/bbc.svg" alt="BBC" />';
            if (bc.includes('ITV')) return '<img src="broadcasts/itv.svg" alt="ITV" />';
            if (bc.includes('STV')) return '<img src="broadcasts/stv.svg" alt="STV" />';
            return '';
        }

        function getBroadcasterClass(broadcast) {
            if (!broadcast) return 'bc-tbc';
            const bc = broadcast.toUpperCase();
            if (bc.includes('BBC')) return 'bc-bbc';
            if (bc.includes('ITV') || bc.includes('STV')) return 'bc-itv';
            return 'bc-tbc';
        }

        document.getElementById('prevDay').onclick = () => jumpToMatchDay(-1);
        document.getElementById('nextDay').onclick = () => jumpToMatchDay(1);
        document.getElementById('todayBtn').onclick = () => jumpToTodayOrNextMatchDay();
        calendarBtn.onclick = () => toggleCalendarCard();
        calendarPrevMonth.onclick = () => {
            calendarMonthCursor = new Date(calendarMonthCursor.getFullYear(), calendarMonthCursor.getMonth() - 1, 1);
            renderCalendarCard();
        };
        calendarNextMonth.onclick = () => {
            calendarMonthCursor = new Date(calendarMonthCursor.getFullYear(), calendarMonthCursor.getMonth() + 1, 1);
            renderCalendarCard();
        };
        document.addEventListener('click', (event) => {
            const target = event.target;
            if (!calendarCard.classList.contains('open')) return;
            if (calendarCard.contains(target) || calendarBtn.contains(target)) return;
            closeCalendarCard();
        });
        datePicker.onchange = () => setDate(datePicker.value);

        if (filterToggleBtn) {
            filterToggleBtn.onclick = () => {
                setFiltersCollapsed(!filtersCollapsed);
            };
        }
        setFiltersCollapsed(filtersCollapsed);

        // Remove any old service worker/cache from the previous version.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister()));
        }
        if ('caches' in window) {
            caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
        }

        fetch(`fixtures.json?cacheBust=${Date.now()}`, { cache: 'no-store' })
            .then(response => response.json())
            .then(data => {
                fixtures = data.sort((a, b) => `${a.date} ${a.timeUK}`.localeCompare(`${b.date} ${b.timeUK}`));
                const availableDates = new Set(fixtures.map(match => match.date));

                if (!availableDates.has(selectedDate)) {
                    const today = isoToday();
                    if (availableDates.has(today)) {
                        selectedDate = today;
                    } else {
                        selectedDate = [...availableDates][0] || today;
                    }
                }

                datePicker.value = selectedDate;

                if (selectedGroup) {
                    render();
                    startGroupLiveRefresh();
                } else {
                    stopGroupLiveRefresh();
                    render();
                }
            })
            .catch(error => {
                matches.innerHTML = '<div class="empty">Could not load fixtures.json. Make sure it is in the same folder as index.html.</div>';
                console.error(error);
            });
    </script>
</body>

</html>
